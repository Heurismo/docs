      operationId: submitRetention
      summary: Enviar una retención al SRI
      description: |
        Encola una retención en borrador o rechazada para su autorización en el
        SRI. La cuenta debe tener un certificado de firma activo. El
        procesamiento ocurre en segundo plano: la retención pasa a `pending` y
        luego a `authorized` o `rejected`. Consulta el estado final con `GET` de
        la retención.
      tags: [Retenciones]
      responses:
        "202":
