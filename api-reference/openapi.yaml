      tags: [Productos]
      responses:
        "204":
          description: El producto fue eliminado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/accounts/{account_id}/invoices:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta. Usa el de tu propia cuenta o el de una cuenta que administras.
        schema:
          type: string
          format: uuid
    get:
      operationId: listInvoices
      summary: Listar facturas
      description: |
        Devuelve las facturas de la cuenta en el ambiente activo (pruebas o
        producción), de la más reciente a la más antigua, con paginación.
      tags: [Facturas]
      parameters:
        - name: query
          in: query
          description: Buscar por número, clave de acceso o autorización, o por nombre o identificación del cliente.
          schema:
            type: string
        - name: status
          in: query
          description: Filtrar por estado.
          schema:
            type: string
            enum: [draft, pending, authorized, rejected, cancelled]
        - name: creditable
          in: query
          description: Con `true`, solo las facturas autorizadas a las que aún les queda valor por acreditar con una nota de crédito. Sin conteo, `pagination.total_count` llega en `null` y `total_pages` dice solo si hay una página más.
          schema:
            type: boolean
        - name: contact_id
          in: query
          description: Filtrar por cliente.
          schema:
            type: string
            format: uuid
        - name: emission_date_from
          in: query
          description: Facturas emitidas desde esta fecha (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: emission_date_to
          in: query
          description: Facturas emitidas hasta esta fecha (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: page
          in: query
          description: Número de página (25 por página).
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Las facturas de la cuenta, paginadas.
          content:
            application/json:
              schema:
                type: object
                required: [invoices, pagination]
                properties:
                  invoices:
                    type: array
                    items:
                      $ref: "#/components/schemas/InvoiceSummary"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      operationId: createInvoice
      summary: Crear una factura
      description: |
        Crea una factura en borrador. Los impuestos de cada ítem se derivan
        automáticamente del producto referenciado; solo envías el producto, la
        cantidad y el descuento. Para enviarla al SRI, usa luego el endpoint de
        envío.
      tags: [Facturas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceCreateRequest"
      responses:
        "201":
          description: La factura creada en borrador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/accounts/{account_id}/invoices/{id}:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        description: Identificador de la factura.
        schema:
          type: string
          format: uuid
    get:
      operationId: getInvoice
      summary: Consultar una factura
      description: Devuelve la factura con sus ítems, cliente y punto de emisión.
      tags: [Facturas]
      parameters:
        - name: excluding_credit_note_id
          in: query
          description: >-
            Deja fuera de `creditable_amount` y de `creditable_quantity` una nota
            de crédito, para editarla partiendo de lo que le dejan las demás.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: La factura.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateInvoice
      summary: Editar una factura
      description: |
        Edita una factura en borrador o rechazada. Puedes cambiar el cliente y el
        método de pago; si envías `items`, reemplaza todos los ítems actuales.
      tags: [Facturas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceUpdateRequest"
      responses:
        "200":
          description: La factura actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteInvoice
      summary: Eliminar una factura
      description: Elimina una factura en borrador. Las facturas ya enviadas al SRI no se pueden eliminar.
      tags: [Facturas]
      responses:
        "204":
          description: La factura fue eliminada.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/accounts/{account_id}/invoices/{id}/submit:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        description: Identificador de la factura.
        schema:
          type: string
          format: uuid
    post:
      operationId: submitInvoice
      summary: Enviar una factura al SRI
      description: |
        Encola una factura en borrador o rechazada para su autorización en el SRI.
        La cuenta debe tener un certificado de firma activo. El procesamiento
        ocurre en segundo plano: la factura pasa a `pending` y luego a
        `authorized` o `rejected`. Consulta el estado final con `GET` de la
        factura.
      tags: [Facturas]
      responses:
        "202":
          description: La factura fue encolada para envío (`pending`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/accounts/{account_id}/invoices/{id}/void:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        description: Identificador de la factura.
        schema:
          type: string
          format: uuid
    post:
      operationId: voidInvoice
      summary: Anular una factura
      description: |
        Anula una factura autorizada. Solo es posible hasta el día 7 del mes
        siguiente a la emisión. Recuerda anular también el comprobante en el SRI.
      tags: [Facturas]
      responses:
        "200":
          description: La factura anulada (`cancelled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/accounts/{account_id}/invoices/{id}/resend_email:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        description: Identificador de la factura.
        schema:
          type: string
          format: uuid
    post:
      operationId: resendInvoiceEmail
      summary: Reenviar una factura por correo
      description: |
