          $ref: "#/components/responses/OrdersForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/accounts/{account_id}/orders/{id}/emit_to_invoice:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        description: Identificador de la orden.
        schema:
          type: string
          format: uuid
    post:
      operationId: emitOrderToInvoice
      summary: Emitir una orden como factura
      description: |
        Crea una factura en borrador con el cliente, el punto de emisión y los
        ítems de la orden, con sus pagos tomados de los abonos (uno por forma de
        pago). La orden queda como `emitted`. Requiere un punto de emisión y
        abonos que cubran el total (`ready_to_emit`). Para enviar la factura al
        SRI, usa luego el endpoint de envío de facturas.
      tags: [Órdenes]
      responses:
        "201":
          description: La factura creada en borrador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrdersForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/accounts/{account_id}/orders/{order_id}/collections:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
      - name: order_id
        in: path
        required: true
        description: Identificador de la orden.
        schema:
          type: string
          format: uuid
    post:
      operationId: createOrderCollection
      summary: Registrar un abono
      description: |
        Registra un abono en una orden abierta. No puede superar el saldo
        pendiente. Devuelve la orden actualizada.
      tags: [Órdenes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionCreateRequest"
      responses:
        "201":
          description: La orden con el abono registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrdersForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/accounts/{account_id}/orders/{order_id}/collections/{id}:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
      - name: order_id
        in: path
        required: true
        description: Identificador de la orden.
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        description: Identificador del abono.
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteOrderCollection
      summary: Eliminar un abono
      description: Elimina un abono de una orden abierta. Devuelve la orden actualizada.
      tags: [Órdenes]
      responses:
        "200":
          description: La orden sin el abono.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrdersForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/accounts/{account_id}/received_documents:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
    get:
      operationId: listReceivedDocuments
      summary: Listar comprobantes recibidos
      description: Devuelve las facturas, notas de crédito y liquidaciones de compra recibidas, de la más reciente a la más antigua, con paginación.
      tags: [Comprobantes recibidos]
      parameters:
        - name: type
          in: query
          description: Filtrar por tipo de comprobante.
          schema:
            type: string
            enum: [invoice, credit_note, purchase_liquidation]
        - name: outstanding
          in: query
          description: Con `true`, solo lo que aún se le debe al proveedor.
          schema:
            type: boolean
        - name: contact_id
          in: query
          description: Filtrar por proveedor.
          schema:
            type: string
            format: uuid
        - name: query
          in: query
          description: Buscar por proveedor (nombre o RUC), número, clave de acceso o autorización.
          schema:
            type: string
        - name: authorization_date_from
          in: query
          description: Autorizados por el SRI desde esta fecha (YYYY-MM-DD, hora de Ecuador).
          schema:
            type: string
            format: date
        - name: authorization_date_to
          in: query
          description: Autorizados por el SRI hasta esta fecha (YYYY-MM-DD, hora de Ecuador).
          schema:
            type: string
            format: date
        - name: page
          in: query
          description: Número de página (25 por página).
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Los comprobantes recibidos, paginados.
          content:
            application/json:
              schema:
                type: object
                required: [received_documents, pagination]
                properties:
                  received_documents:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReceivedDocumentSummary"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReceivedDocumentsForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/accounts/{account_id}/received_documents/{id}:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        description: Identificador del comprobante recibido.
        schema:
          type: string
          format: uuid
    get:
      operationId: getReceivedDocument
      summary: Consultar un comprobante recibido
      description: Devuelve el comprobante con su detalle, sus impuestos y los pagos hechos al proveedor.
      tags: [Comprobantes recibidos]
      responses:
        "200":
          description: El comprobante recibido.
          content:
            application/json:
              schema:
                type: object
                required: [received_document]
                properties:
                  received_document:
                    $ref: "#/components/schemas/ReceivedDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReceivedDocumentsForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Token de API enviado como `Authorization: Bearer tellen_tk_...`. Genera
        tu token desde tu cuenta de Tellen. Tu cuenta debe tener el acceso a la
        API habilitado.
  schemas:
    User:
      type: object
      required: [id, email, name, image_url, provider]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: [string, "null"]
          description: Nombre y apellido, o `null` si no los ha registrado.
        image_url:
          type: [string, "null"]
          format: uri
          description: Foto de perfil de Google o Apple, o `null` si no tiene.
        provider:
          type: [string, "null"]
          enum: [google_oauth2, apple, null]
          description: Con qué cuenta inicia sesión, o `null` si usa correo y contraseña.
    Account:
      type: object
      description: Forma resumida (para listados).
      required: [id, razon_social, nombre_comercial, ruc, plan]
      properties:
        id:
          type: string
          format: uuid
        razon_social:
          type: string
          description: Razón social (nombre legal registrado del negocio).
        nombre_comercial:
          type: string
          description: Nombre comercial del negocio.
        ruc:
          type: string
          description: RUC ecuatoriano de 13 dígitos.
        plan:
          type: string
          enum: [basico, profesional, empresarial]
        logo_url:
          type: [string, "null"]
          format: uri
          description: URL pública del logo de la cuenta, o `null` si no tiene.
    AccountDetail:
      description: Forma completa (al consultar, crear o actualizar una cuenta), con el perfil del SRI, datos de contacto y establecimientos.
      allOf:
        - $ref: "#/components/schemas/Account"
        - type: object
          required: [dir_matriz, email, phone, billing_email, regimen, obligado_contabilidad, agente_retencion, contribuyente_especial, exportador, production_mode, can_issue_documents, permissions, stores, created_at]
          properties:
            dir_matriz:
              type: string
              description: Dirección de la matriz.
            email:
              type: string
              format: email
            phone:
              type: string
            billing_email:
              type: [string, "null"]
            regimen:
              type: [string, "null"]
              enum: [general, negocio_popular, rimpe, null]
            obligado_contabilidad:
              type: boolean
            agente_retencion:
              type: boolean
            contribuyente_especial:
              type: boolean
            exportador:
              type: [boolean, "null"]
            production_mode:
              type: boolean
              description: "true = ambiente de producción del SRI; false = pruebas."
            can_issue_documents:
              type: boolean
              description: |
                `false` cuando la cuenta no tiene un plan activo y ya usó sus
                facturas gratuitas. Mientras tanto, los recursos de la cuenta
                responden `402`.
            permissions:
              type: object
              description: |
                Lo que puedes hacer en la cuenta, según su plan y tu rol en ella.
                Con un token de API todo lo que el plan incluye es `true`.
              required: [create_invoices, edit_invoices, submit_invoices, void_invoices, create_quotes, convert_quotes, create_orders, emit_orders, record_collections, read_received_documents, manage_contacts, manage_products, read_certificates, read_reports, manage_settings]
              properties:
                create_invoices:
                  type: boolean
                edit_invoices:
                  type: boolean
                  description: Editar facturas en borrador o rechazadas.
                submit_invoices:
                  type: boolean
                  description: Enviar facturas al SRI.
                void_invoices:
                  type: boolean
                  description: Anular facturas autorizadas.
                create_quotes:
                  type: boolean
                  description: Crear cotizaciones (proformas).
                convert_quotes:
                  type: boolean
                  description: Convertir cotizaciones en factura.
                create_orders:
                  type: boolean
                  description: Crear órdenes con abonos.
                emit_orders:
                  type: boolean
                  description: Emitir órdenes como factura.
                record_collections:
                  type: boolean
                  description: Registrar y eliminar abonos.
                read_received_documents:
                  type: boolean
                  description: Ver los comprobantes recibidos de proveedores.
                manage_contacts:
                  type: boolean
                  description: Crear, editar y eliminar clientes y proveedores.
                manage_products:
                  type: boolean
                  description: Crear, editar y eliminar productos.
                read_certificates:
                  type: boolean
                  description: Ver los certificados de firma electrónica.
                read_reports:
                  type: boolean
                  description: Ver reportes y el resumen del mes.
                manage_settings:
                  type: boolean
                  description: Editar los datos y la configuración de la cuenta.
            stores:
              type: array
              description: Establecimientos de la cuenta.
              items:
                type: object
                required: [id, code, name]
                properties:
                  id:
                    type: string
                    format: uuid
                  code:
                    type: string
                  name:
                    type: string
            created_at:
              type: string
              format: date-time
    AccountEnvelope:
      type: object
      required: [account]
      properties:
        account:
          $ref: "#/components/schemas/AccountDetail"
    AccountSummaryEnvelope:
      type: object
      required: [summary]
      properties:
        summary:
          $ref: "#/components/schemas/AccountSummary"
    AccountSummary:
      type: object
      required: [month, sales, receivable, purchases, payable]
      properties:
        month:
          type: string
          description: El mes resumido, como `AAAA-MM`.
          example: "2026-10"
        sales:
          type: object
          description: Facturas autorizadas emitidas en el mes.
          required: [total, count]
          properties:
            total:
              type: number
            count:
              type: integer
        receivable:
          type: object
          description: Lo que hoy deben los clientes por facturas a crédito, sin importar el mes.
          required: [total, overdue]
          properties:
            total:
              type: number
            overdue:
              type: number
              description: La parte ya vencida.
        purchases:
          type: object
          description: |
            Facturas y notas de débito recibidas emitidas en el mes, más las
            liquidaciones de compra autorizadas.
          required: [total]
          properties:
            total:
              type: number
        payable:
          type: object
          description: Lo que hoy se debe a proveedores por documentos recibidos, sin importar el mes.
          required: [total, count]
          properties:
            total:
              type: number
            count:
              type: integer
              description: Documentos con saldo pendiente.
    Certificate:
      type: object
      required: [id, name, active, expires_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Nombre generado del certificado (incluye el RUC y la fecha de vencimiento).
        active:
          type: boolean
          description: Si es el certificado activo de la cuenta (solo uno lo está a la vez).
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Fecha de vencimiento del certificado.
    CertificateEnvelope:
      type: object
      required: [certificate]
      properties:
        certificate:
          $ref: "#/components/schemas/Certificate"
    CertificateCreateRequest:
      type: object
      required: [certificate]
      properties:
        certificate:
          type: object
          required: [p12_file, p12_password]
          properties:
            p12_file:
              type: string
              format: byte
              description: Archivo .p12 (PKCS#12) codificado en base64.
            p12_password:
              type: string
              description: Contraseña del certificado .p12.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Mensaje de error descriptivo, en español.
    AccountCreateRequest:
      type: object
      required: [account]
      properties:
        account:
          type: object
          required: [ruc, email, phone, plan]
          description: |
            Solo necesitas el RUC, los datos de contacto y el plan. El perfil del
            negocio (razón social, dirección, régimen, obligaciones tributarias) y
            los establecimientos activos se obtienen automáticamente del SRI y no
            se pueden sobrescribir.
          properties:
            ruc:
              type: string
              description: RUC ecuatoriano de 13 dígitos. Debe ser único y existir en el SRI.
            email:
              type: string
              format: email
            phone:
              type: string
            plan:
              type: string
              enum: [basico, profesional, empresarial]
            production_mode:
              type: boolean
              description: Ambiente del SRI. Si se omite, la cuenta se crea en el ambiente de pruebas (`false`).
    AccountUpdateRequest:
      type: object
      required: [account]
      properties:
        account:
          type: object
          description: |
            Envía solo los campos que quieras cambiar. El campo `plan` se ignora
            al editar tu propia cuenta y solo se aplica al editar una cuenta que
            administras.
          properties:
            razon_social:
              type: string
              description: Razón social (nombre legal registrado del negocio).
            nombre_comercial:
              type: string
              description: Nombre comercial del negocio.
            dir_matriz:
              type: string
              description: Dirección de la matriz (establecimiento principal).
            email:
              type: string
              format: email
            phone:
              type: string
            billing_email:
              type: string
              format: email
            plan:
              type: string
              enum: [basico, profesional, empresarial]
            regimen:
              type: string
              enum: [general, negocio_popular, rimpe]
            obligado_contabilidad:
              type: boolean
            agente_retencion:
              type: boolean
            contribuyente_especial:
              type: boolean
            exportador:
              type: boolean
            sector_turistico:
              type: boolean
            production_mode:
              type: boolean
    Pagination:
      type: object
      required: [page, total_pages, total_count]
      properties:
        page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: integer
    InvoiceSummary:
      type: object
      required: [id, status, sequential, emission_date, total]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, pending, authorized, rejected, cancelled]
        sequential:
          type: string
          description: Secuencial completo (establecimiento-punto-secuencial).
        emission_date:
          type: string
          format: date
        contact_name:
          type: [string, "null"]
          description: Razón social del cliente.
        total:
          type: number
          description: Total de la factura, con impuestos.
    TaxTotal:
      type: object
      required: [code, label, rate, base, iva]
      properties:
        code:
          type: string
          description: Código de porcentaje de IVA del SRI.
        label:
          type: string
          description: Como lo nombra el RIDE, p. ej. "IVA 15%" o "no objeto de IVA".
        rate:
          type: number
        base:
          type: number
          description: Subtotal gravado con este tipo de IVA.
        iva:
          type: number
    DocumentDetail:
      type: object
      required: [id, product_id, product_variant_id, code, description, quantity, unit_price, discount, subtotal, tax_rate, tax_value, ice_rate, total]
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: [string, "null"]
          format: uuid
        product_variant_id:
          type: [string, "null"]
          format: uuid
          description: Variante facturada. Para editar el documento, reenvíala como `product_variant_id`.
        code:
          type: [string, "null"]
        description:
          type: string
        quantity:
          type: number
        unit_price:
          type: number
        discount:
          type: number
        subtotal:
          type: number
        tax_rate:
          type: number
          description: Porcentaje de IVA aplicado.
        tax_value:
          type: number
        ice_rate:
          type: [number, "null"]
          description: Porcentaje de ICE del ítem, o `null` si no grava ICE.
        total:
          type: number
    Invoice:
      type: object
      required: [id, status, sequential, emission_date, contact, emission_point, payment_method, payments, total_without_taxes, total_discount, taxes, total_ice, total, access_key, authorization_number, error_message, public_url, pdf_url, created_at, items]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, pending, authorized, rejected, cancelled]
        sequential:
          type: string
        emission_date:
          type: string
          format: date
        contact:
          type: object
          properties:
            id:
              type: string
              format: uuid
            razon_social:
              type: [string, "null"]
            identificacion:
              type: [string, "null"]
        emission_point:
          type: object
          properties:
            id:
              type: string
              format: uuid
            code:
              type: [string, "null"]
            store_code:
              type: [string, "null"]
        payment_method:
          type: string
          description: Código SRI de la forma de pago principal (el primer pago de contado, o el primero si todo es a crédito).
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        total_without_taxes:
          type: number
        total_discount:
          type: number
        taxes:
          type: array
          description: Base e IVA por tipo de IVA, como los totaliza el RIDE.
          items:
            $ref: "#/components/schemas/TaxTotal"
        total_ice:
          type: number
        total:
          type: number
        access_key:
          type: [string, "null"]
          description: Clave de acceso de 49 dígitos (presente una vez enviada al SRI).
        authorization_number:
          type: [string, "null"]
        error_message:
          type: [string, "null"]
          description: Motivo del rechazo, cuando el estado es `rejected`.
        public_url:
          type: [string, "null"]
          format: uri
          description: Página pública de la factura para compartir con el cliente. Solo cuando está autorizada.
        pdf_url:
          type: [string, "null"]
          format: uri
          description: El RIDE en PDF. Solo cuando está autorizada.
        created_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/DocumentDetail"
    Payment:
      type: object
      required: [forma_pago, detail_code, amount, plazo, due_date, notes]
      properties:
        forma_pago:
          type: string
          description: Código SRI de forma de pago.
        detail_code:
          type: [string, "null"]
          description: Detalle interno de la forma de pago (marca de tarjeta, banco), p. ej. `visa_credito`.
        amount:
          type: number
        plazo:
          type: [integer, "null"]
          description: Días de crédito. Vacío si se pagó de contado.
        due_date:
          type: [string, "null"]
          format: date
          description: Fecha de vencimiento de un pago a crédito.
        notes:
          type: [string, "null"]
    PaymentRequest:
      type: object
      required: [forma_pago, amount]
      properties:
        forma_pago:
          type: string
          enum: ["01", "15", "16", "17", "18", "19", "20", "21"]
          description: Código SRI de forma de pago.
        detail_code:
          type: string
          enum: [amex, visa_credito, mastercard_credito, diners, discover, visa_debito, mastercard_debito, banco_pichincha, banco_guayaquil, produbanco, banco_pacifico, banco_bolivariano, banco_internacional, banco_austro, banco_solidario, banco_promerica, otra_institucion]
          description: |
            Detalle opcional de la forma de pago. Debe pertenecer a `forma_pago`:

            - `19` Tarjeta de crédito: `amex`, `visa_credito`, `mastercard_credito`, `diners`, `discover`
            - `16` Tarjeta de débito: `visa_debito`, `mastercard_debito`
            - `20` Otros con utilización del sistema financiero: `banco_pichincha`, `banco_guayaquil`, `produbanco`, `banco_pacifico`, `banco_bolivariano`, `banco_internacional`, `banco_austro`, `banco_solidario`, `banco_promerica`, `otra_institucion`
        amount:
          type: number
          description: Monto del pago. Los pagos deben sumar el total de la factura.
        plazo:
          type: integer
          description: Días de crédito. Omítelo para un pago de contado.
        notes:
          type: string
    InvoiceEnvelope:
      type: object
      required: [invoice]
      properties:
        invoice:
          $ref: "#/components/schemas/Invoice"
    DocumentStatus:
      type: object
      description: Identificador y estado de un documento tras una acción de ciclo de vida (envío, anulación). Consulta el recurso completo con `GET`.
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, pending, authorized, rejected, cancelled]
    DocumentDetailRequest:
      type: object
      description: |
        Referencia un producto por `product_variant_id` (preferido) o por
        `product_id` (usa la variante por defecto del producto). Los impuestos
        se derivan del producto.
