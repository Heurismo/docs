  /api/v1/accounts/{account_id}/retentions:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta. Usa el de tu propia cuenta o el de una cuenta que administras.
        schema:
          type: string
          format: uuid
    get:
      operationId: listRetentions
      summary: Listar retenciones
      description: |
        Devuelve los comprobantes de retención de la cuenta en el ambiente activo
        (pruebas o producción), del más reciente al más antiguo, con paginación.
      tags: [Retenciones]
      parameters:
        - name: query
          in: query
          description: Buscar por número, clave de acceso, autorización o período fiscal, o por nombre o identificación del proveedor.
          schema:
            type: string
        - name: status
          in: query
          description: Filtrar por estado.
          schema:
            type: string
            enum: [draft, pending, authorized, rejected, cancelled]
        - name: contact_id
          in: query
          description: Filtrar por proveedor.
          schema:
            type: string
            format: uuid
        - name: emission_date_from
          in: query
          description: Retenciones emitidas desde esta fecha (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: emission_date_to
          in: query
          description: Retenciones emitidas hasta esta fecha (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: page
          in: query
          description: Número de página (25 por página).
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Las retenciones de la cuenta, paginadas.
          content:
            application/json:
              schema:
                type: object
                required: [retentions, pagination]
                properties:
                  retentions:
                    type: array
                    items:
                      $ref: "#/components/schemas/RetentionSummary"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createRetention
      summary: Crear una retención
      description: |
        Crea una retención en borrador sobre uno o más documentos de sustento del
        mismo proveedor. Nombras cada documento por su origen (`source_type` y
        `source_id`): una factura o nota de débito recibida o una liquidación de
        compra autorizada. El proveedor, el número, la
        autorización y los impuestos salen del documento; tú eliges los códigos
        de retención (`GET retention_codes`) y, si quieres, su base. Un
        comprobante admite una sola retención vigente: si ya tiene una que no
        está anulada, la creación falla. Para enviarla al SRI, usa luego el
        endpoint de envío.
      tags: [Retenciones]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionWriteRequest"
      responses:
        "201":
          description: La retención creada en borrador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/accounts/{account_id}/retentions/{id}:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        description: Identificador de la retención.
        schema:
          type: string
          format: uuid
    get:
      operationId: getRetention
      summary: Consultar una retención
      description: Devuelve la retención con su proveedor, punto de emisión y lo que retiene en cada documento de sustento.
      tags: [Retenciones]
      responses:
        "200":
