        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProduct
      summary: Actualizar un producto
      description: |
        Envía solo los campos que quieras cambiar. Las existencias no se editan
        aquí: se mueven a través del kardex, así que `stock_quantity` no es
        modificable e `initial_stock` se ignora.
      tags: [Productos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdateRequest"
      responses:
        "200":
          description: El producto actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
