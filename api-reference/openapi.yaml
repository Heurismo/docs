    - name: id
      in: path
      required: true
      description: Identificador de la retención.
      schema:
        type: string
        format: uuid
    post:
      operationId: voidRetention
      summary: Anular una retención
      description: |
        Anula una retención autorizada. Solo es posible hasta el día 7 del mes
        siguiente a la emisión. Recuerda anular también el comprobante en el SRI.
      tags:
      - Retenciones
      responses:
