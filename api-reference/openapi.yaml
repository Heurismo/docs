  /api/v1/accounts/{account_id}/received_documents:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
    get:
      operationId: listReceivedDocuments
      summary: Listar comprobantes recibidos
      description: Devuelve los comprobantes recibidos (facturas, notas de crédito y de débito, liquidaciones de compra y retenciones), del más reciente al más antiguo, con paginación.
      tags: [Comprobantes recibidos]
      parameters:
        - name: type
          in: query
          description: Filtrar por tipo de comprobante.
          schema:
            type: string
            enum: [invoice, credit_note, debit_note, purchase_liquidation, retention]
        - name: outstanding
          in: query
          description: Con `true`, solo lo que aún se le debe al proveedor.
          schema:
            type: boolean
        - name: contact_id
          in: query
          description: Filtrar por proveedor.
          schema:
            type: string
            format: uuid
        - name: query
          in: query
          description: Buscar por proveedor (nombre o RUC), número, clave de acceso o autorización.
          schema:
            type: string
        - name: authorization_date_from
          in: query
          description: Autorizados por el SRI desde esta fecha (YYYY-MM-DD, hora de Ecuador).
          schema:
            type: string
            format: date
        - name: authorization_date_to
          in: query
          description: Autorizados por el SRI hasta esta fecha (YYYY-MM-DD, hora de Ecuador).
          schema:
            type: string
            format: date
        - name: page
          in: query
          description: Número de página (25 por página).
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Los comprobantes recibidos, paginados.
          content:
            application/json:
              schema:
                type: object
                required: [received_documents, pagination]
                properties:
                  received_documents:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReceivedDocumentSummary"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReceivedDocumentsForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      operationId: createReceivedDocument
      summary: Registrar un comprobante recibido por su clave de acceso
      description: |
        Trae del SRI el XML autorizado de la clave de acceso y lo registra en Compras, con el proveedor, los valores y el detalle, como si llegara en el reporte del SRI.

        El comprobante tiene que estar a nombre de la cuenta, ser de producción y de los últimos 30 días (el SRI no entrega los más antiguos). Si la clave ya está registrada, responde `200` con ese comprobante.
      tags: [Comprobantes recibidos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [received_document]
              properties:
                received_document:
                  type: object
                  required: [access_key]
                  properties:
                    access_key:
                      type: string
                      pattern: "^[0-9]{49}$"
                      description: Clave de acceso (número de autorización), 49 dígitos.
                source:
                  type: string
                  enum: [barcode, photo, manual]
                  description: De dónde salió la clave. Solo para estadísticas.
      responses:
        "201":
          description: El comprobante, registrado.
          content:
            application/json:
              schema:
                type: object
                required: [received_document]
                properties:
                  received_document:
                    $ref: "#/components/schemas/ReceivedDocument"
        "200":
          description: La clave ya estaba registrada; el comprobante existente.
          content:
            application/json:
              schema:
                type: object
                required: [received_document]
                properties:
                  received_document:
                    $ref: "#/components/schemas/ReceivedDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReceivedDocumentsForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/accounts/{account_id}/received_documents/access_key_readings:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
    post:
      operationId: readReceivedDocumentAccessKey
      summary: Leer la clave de acceso de una foto
      description: |
        Lee con AI la clave de acceso de la foto de un comprobante impreso (RIDE), para cuando su código de barras no se puede escanear. No guarda la foto ni registra nada: usa la clave con `POST /received_documents`.

        Usa los créditos de AI de la cuenta. `valid` es `false` si no se leyeron los 49 dígitos.
      tags: [Comprobantes recibidos]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: "Foto del comprobante (JPEG, PNG, WebP o HEIC, hasta 10 MB)."
      responses:
        "200":
          description: Lo que se leyó.
          content:
            application/json:
              schema:
                type: object
                required: [access_key, valid]
                properties:
                  access_key:
                    type: [string, "null"]
                    description: Los dígitos leídos, o null si no se leyó nada.
                  valid:
                    type: boolean
                    description: Si se leyeron los 49 dígitos de una clave de acceso.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReceivedDocumentsForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/accounts/{account_id}/received_documents/{id}:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        description: Identificador del comprobante recibido.
        schema:
          type: string
          format: uuid
    get:
      operationId: getReceivedDocument
      summary: Consultar un comprobante recibido
      description: Devuelve el comprobante con su detalle según el tipo (líneas e impuestos, motivos de una nota de débito o lo retenido en una retención) y los pagos hechos al proveedor.
      tags: [Comprobantes recibidos]
      responses:
        "200":
          description: El comprobante recibido.
          content:
            application/json:
              schema:
                type: object
                required: [received_document]
                properties:
                  received_document:
                    $ref: "#/components/schemas/ReceivedDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReceivedDocumentsForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/accounts/{account_id}/received_documents/{received_document_id}/disbursements:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
      - name: received_document_id
        in: path
        required: true
        description: Identificador del comprobante recibido.
        schema:
          type: string
          format: uuid
    post:
      operationId: createReceivedDocumentDisbursement
      summary: Registrar un pago al proveedor
      description: |
        Registra un pago en una factura o nota de débito recibida. Se debe el
        total del comprobante y el pago no puede superar el saldo pendiente.
        Devuelve el comprobante actualizado.
      tags: [Comprobantes recibidos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisbursementCreateRequest"
      responses:
        "201":
          description: El comprobante con el pago registrado.
          content:
            application/json:
              schema:
                type: object
                required: [received_document]
                properties:
                  received_document:
                    $ref: "#/components/schemas/ReceivedDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReceivedDocumentsForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/accounts/{account_id}/received_documents/{received_document_id}/disbursements/{id}:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
      - name: received_document_id
        in: path
        required: true
        description: Identificador del comprobante recibido.
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        description: Identificador del pago.
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteReceivedDocumentDisbursement
      summary: Eliminar un pago al proveedor
      description: Elimina un pago del comprobante. Devuelve el comprobante actualizado.
      tags: [Comprobantes recibidos]
      responses:
        "200":
          description: El comprobante sin el pago.
          content:
            application/json:
              schema:
                type: object
                required: [received_document]
                properties:
                  received_document:
                    $ref: "#/components/schemas/ReceivedDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReceivedDocumentsForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/accounts/{account_id}/receivables:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
    get:
      operationId: getReceivables
      summary: Consultar las cuentas por cobrar
      description: |
        Lo que te deben hoy: las facturas autorizadas a crédito con saldo
        pendiente, en el ambiente de la cuenta, agrupadas por cliente. Los
        clientes y sus facturas van del vencimiento más próximo (o más
        vencido) al más lejano.
      tags: [Reportes]
      responses:
        "200":
          description: Las cuentas por cobrar.
          content:
            application/json:
              schema:
                type: object
                required: [receivables]
                properties:
                  receivables:
                    $ref: "#/components/schemas/Receivables"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReportsForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/accounts/{account_id}/payables:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
    get:
      operationId: getPayables
      summary: Consultar las cuentas por pagar
      description: |
        Lo que debes hoy: las facturas y notas de débito recibidas con saldo
        pendiente, sin importar su antigüedad, agrupadas por proveedor. Aún no
        se separa lo vencido: los comprobantes recibidos no guardan el plazo
        del proveedor.
      tags: [Reportes]
      responses:
        "200":
          description: Las cuentas por pagar.
          content:
            application/json:
              schema:
                type: object
                required: [payables]
                properties:
                  payables:
                    $ref: "#/components/schemas/Payables"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReportsForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/accounts/{account_id}/members:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
    get:
      operationId: listMembers
      summary: Listar usuarios
      description: Devuelve los usuarios de la cuenta, del más antiguo al más reciente, y las invitaciones pendientes, de la más reciente a la más antigua.
      tags: [Usuarios]
      responses:
        "200":
          description: Usuarios e invitaciones pendientes.
          content:
            application/json:
              schema:
                type: object
                required: [members, invitations]
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/Member"
                  invitations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/UsersForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/accounts/{account_id}/members/{id}:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        description: Identificador del usuario en la cuenta (`Member.id`).
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateMember
      summary: Cambiar el rol de un usuario
      description: |
        Solo un propietario puede asignar el rol de propietario o cambiar el
        rol de otro propietario, y el rol de desarrollador solo existe en
        cuentas de plataforma. El último propietario de la cuenta no puede
        cambiar de rol.
      tags: [Usuarios]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdateRequest"
      responses:
        "200":
          description: El usuario con su nuevo rol.
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member:
                    $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/UsersForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteMember
      summary: Quitar un usuario
      description: |
        Quita al usuario de la cuenta; deja de tener acceso. Solo un
        propietario puede quitar a otro propietario, y no se puede quitar al
        último. Puedes quitarte a ti mismo.
      tags: [Usuarios]
      responses:
        "204":
          description: El usuario ya no es parte de la cuenta.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/UsersForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/accounts/{account_id}/invitations:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
    post:
      operationId: createInvitation
      summary: Invitar a un usuario
      description: |
        Envía una invitación por correo. Si la persona ya usa Tellen, la acepta
        con su cuenta; si no, crea una al aceptarla. Cuenta para el límite de
        usuarios del plan cuando la acepta; si la cuenta ya llegó al límite,
        responde `422`.
      tags: [Usuarios]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreateRequest"
      responses:
        "201":
          description: La invitación enviada.
          content:
            application/json:
              schema:
                type: object
                required: [invitation]
                properties:
                  invitation:
                    $ref: "#/components/schemas/Invitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/UsersForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/accounts/{account_id}/invitations/{id}:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        description: Identificador de la invitación.
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteInvitation
      summary: Cancelar una invitación
      description: Cancela una invitación pendiente; el enlace del correo deja de funcionar.
      tags: [Usuarios]
      responses:
        "204":
          description: La invitación fue cancelada.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/UsersForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/accounts/{account_id}/reports/sales_summary:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
    get:
      operationId: getSalesSummaryReport
      summary: Consultar el reporte de ventas
      description: |
        Facturas autorizadas en un rango de fechas: totales frente al período
        anterior, la serie por día (o por mes en rangos de más de 92 días), y
        los principales clientes, productos y establecimientos.

        Las ventas son netas: sin IVA ni otros impuestos, que se le deben al
        SRI. Solo `total` incluye impuestos.
      tags: [Reportes]
      parameters:
        - name: from
          in: query
          required: false
          description: Primer día del rango, como `AAAA-MM-DD`. Va junto con `to`; sin ambos, el mes en curso.
          schema:
            type: string
            format: date
            example: "2026-10-01"
        - name: to
          in: query
          required: false
          description: Último día del rango, como `AAAA-MM-DD`.
          schema:
            type: string
            format: date
            example: "2026-10-31"
        - name: store_id
          in: query
          required: false
          description: Solo las ventas de este establecimiento. Sin él, todos.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: El reporte de ventas.
          content:
            application/json:
              schema:
                type: object
                required: [sales_summary]
                properties:
                  sales_summary:
                    $ref: "#/components/schemas/SalesSummaryReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReportsForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/accounts/{account_id}/reports/iva:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
    get:
      operationId: getIvaReport
      summary: Consultar el reporte de IVA
      description: |
        El IVA del período para la declaración, mensual o semestral: ventas y
        compras por tarifa, las retenciones recibidas y emitidas, y si el
        período deja IVA por pagar o crédito tributario.
      tags: [Reportes]
      parameters:
        - name: period
          in: query
          required: false
          description: |
            Un mes, como `AAAA-MM`, o un semestre, como `AAAA-S1` (enero a junio)
            o `AAAA-S2` (julio a diciembre). Por defecto, el mes o el semestre en
            curso, según la periodicidad de IVA de la cuenta.
          schema:
            type: string
            pattern: "^\\d{4}-(0[1-9]|1[0-2]|S[12])$"
            example: "2026-S2"
      responses:
        "200":
          description: El reporte de IVA.
          content:
            application/json:
              schema:
                type: object
                required: [iva]
                properties:
                  iva:
                    $ref: "#/components/schemas/IvaReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReportsForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Token de API enviado como `Authorization: Bearer tellen_tk_...`. Genera
        tu token desde tu cuenta de Tellen. Tu cuenta debe tener el acceso a la
        API habilitado.
  schemas:
    User:
      type: object
      required: [id, email, name, image_url, provider]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: [string, "null"]
          description: Nombre y apellido, o `null` si no los ha registrado.
        image_url:
          type: [string, "null"]
          format: uri
          description: Foto de perfil de Google o Apple, o `null` si no tiene.
        provider:
          type: [string, "null"]
          enum: [google_oauth2, apple, null]
          description: Con qué cuenta inicia sesión, o `null` si usa correo y contraseña.
    Account:
      type: object
      description: Forma resumida (para listados).
      required: [id, razon_social, nombre_comercial, ruc, plan]
      properties:
        id:
          type: string
          format: uuid
        razon_social:
          type: string
          description: Razón social (nombre legal registrado del negocio).
        nombre_comercial:
          type: string
          description: Nombre comercial del negocio.
        ruc:
          type: string
          description: RUC ecuatoriano de 13 dígitos.
        plan:
          type: string
          enum: [basico, profesional, empresarial]
        logo_url:
          type: [string, "null"]
          format: uri
          description: URL pública del logo de la cuenta, o `null` si no tiene.
    AccountDetail:
      description: Forma completa (al consultar, crear o actualizar una cuenta), con el perfil del SRI, datos de contacto y establecimientos.
      allOf:
        - $ref: "#/components/schemas/Account"
        - type: object
          required: [dir_matriz, email, phone, billing_email, regimen, obligado_contabilidad, agente_retencion, contribuyente_especial, exportador, production_mode, can_issue_documents, permissions, user_count, user_limit, stores, created_at]
          properties:
            dir_matriz:
              type: string
              description: Dirección de la matriz.
            email:
              type: string
              format: email
            phone:
              type: string
            billing_email:
              type: [string, "null"]
            regimen:
              type: [string, "null"]
              enum: [general, negocio_popular, rimpe, null]
            obligado_contabilidad:
              type: boolean
            agente_retencion:
              type: boolean
            contribuyente_especial:
              type: boolean
            exportador:
              type: [boolean, "null"]
            production_mode:
              type: boolean
              description: "true = ambiente de producción del SRI; false = pruebas."
            can_issue_documents:
              type: boolean
              description: |
                `false` cuando la cuenta no tiene un plan activo y ya usó sus
                facturas gratuitas. Mientras tanto, los recursos de la cuenta
                responden `402`.
            permissions:
              type: object
              description: |
                Lo que puedes hacer en la cuenta, según su plan y tu rol en ella.
                Con un token de API todo lo que el plan incluye es `true`.
              required: [create_invoices, edit_invoices, submit_invoices, void_invoices, create_credit_notes, edit_credit_notes, submit_credit_notes, void_credit_notes, create_debit_notes, edit_debit_notes, submit_debit_notes, void_debit_notes, create_purchase_liquidations, edit_purchase_liquidations, submit_purchase_liquidations, void_purchase_liquidations, create_retentions, edit_retentions, submit_retentions, void_retentions, create_guia_remisions, edit_guia_remisions, submit_guia_remisions, void_guia_remisions, manage_transportistas, create_quotes, convert_quotes, convert_quotes_to_orders, send_quotes, create_orders, emit_orders, record_collections, read_received_documents, create_received_documents, manage_contacts, manage_products, read_certificates, read_reports, manage_settings, manage_users]
              properties:
                create_invoices:
                  type: boolean
                edit_invoices:
                  type: boolean
                  description: Editar facturas en borrador o rechazadas.
                submit_invoices:
                  type: boolean
                  description: Enviar facturas al SRI.
                void_invoices:
                  type: boolean
                  description: Anular facturas autorizadas.
                create_credit_notes:
                  type: boolean
                  description: Crear notas de crédito.
                edit_credit_notes:
                  type: boolean
                  description: Editar notas de crédito en borrador o rechazadas.
                submit_credit_notes:
                  type: boolean
                  description: Enviar notas de crédito al SRI.
                void_credit_notes:
                  type: boolean
                  description: Anular notas de crédito autorizadas.
                create_debit_notes:
                  type: boolean
                  description: Crear notas de débito.
                edit_debit_notes:
                  type: boolean
                  description: Editar notas de débito en borrador o rechazadas.
                submit_debit_notes:
                  type: boolean
                  description: Enviar notas de débito al SRI.
                void_debit_notes:
                  type: boolean
                  description: Anular notas de débito autorizadas.
                create_purchase_liquidations:
                  type: boolean
                  description: Crear liquidaciones de compra.
                edit_purchase_liquidations:
                  type: boolean
                  description: Editar liquidaciones de compra en borrador o rechazadas.
                submit_purchase_liquidations:
                  type: boolean
                  description: Enviar liquidaciones de compra al SRI.
                void_purchase_liquidations:
                  type: boolean
                  description: Anular liquidaciones de compra autorizadas.
                create_retentions:
                  type: boolean
                  description: Crear retenciones.
                edit_retentions:
                  type: boolean
                  description: Editar retenciones en borrador o rechazadas.
                submit_retentions:
                  type: boolean
                  description: Enviar retenciones al SRI.
                void_retentions:
                  type: boolean
                  description: Anular retenciones autorizadas.
                create_guia_remisions:
                  type: boolean
                  description: Crear guías de remisión.
                edit_guia_remisions:
                  type: boolean
                  description: Editar guías de remisión en borrador o rechazadas.
                submit_guia_remisions:
                  type: boolean
                  description: Enviar guías de remisión al SRI.
                void_guia_remisions:
                  type: boolean
                  description: Anular guías de remisión autorizadas.
                manage_transportistas:
                  type: boolean
                  description: Crear transportistas.
                create_quotes:
                  type: boolean
                  description: Crear cotizaciones (proformas).
                convert_quotes:
                  type: boolean
                  description: Convertir cotizaciones en factura.
                convert_quotes_to_orders:
                  type: boolean
                  description: Convertir cotizaciones en orden.
                send_quotes:
                  type: boolean
                  description: Enviar cotizaciones por correo al cliente.
                create_orders:
                  type: boolean
                  description: Crear órdenes con abonos.
                emit_orders:
                  type: boolean
                  description: Emitir órdenes como factura.
                record_collections:
                  type: boolean
                  description: Registrar y eliminar abonos.
                read_received_documents:
                  type: boolean
                  description: Ver los comprobantes recibidos de proveedores.
                create_received_documents:
                  type: boolean
                  description: Registrar comprobantes recibidos por su clave de acceso.
                manage_contacts:
                  type: boolean
                  description: Crear, editar y eliminar clientes y proveedores.
                manage_products:
                  type: boolean
                  description: Crear, editar y eliminar productos.
                read_certificates:
                  type: boolean
                  description: Ver los certificados de firma electrónica.
                read_reports:
                  type: boolean
                  description: Ver reportes y el resumen del mes.
                manage_settings:
                  type: boolean
                  description: Editar los datos y la configuración de la cuenta.
                manage_users:
                  type: boolean
                  description: Invitar, quitar y cambiar el rol de los usuarios.
            user_count:
              type: integer
              description: Usuarios de la cuenta. Las invitaciones pendientes no cuentan hasta que se aceptan.
            user_limit:
              type: integer
              description: Usuarios que permite el plan.
            stores:
              type: array
              description: Establecimientos de la cuenta.
              items:
                type: object
                required: [id, code, name]
                properties:
                  id:
                    type: string
                    format: uuid
                  code:
                    type: string
                  name:
                    type: string
            created_at:
              type: string
              format: date-time
    AccountEnvelope:
      type: object
      required: [account]
      properties:
        account:
          $ref: "#/components/schemas/AccountDetail"
    AccountSummaryEnvelope:
      type: object
      required: [summary]
      properties:
        summary:
          $ref: "#/components/schemas/AccountSummary"
    AccountSummary:
      type: object
      required: [month, sales, receivable, purchases, payable]
      properties:
        month:
          type: string
          description: El mes resumido, como `AAAA-MM`.
          example: "2026-10"
        sales:
          type: object
          description: Facturas autorizadas emitidas en el mes.
          required: [total, count]
          properties:
            total:
              type: number
            count:
              type: integer
        receivable:
          type: object
          description: Lo que hoy deben los clientes por facturas a crédito, sin importar el mes.
          required: [total, overdue]
          properties:
            total:
              type: number
            overdue:
              type: number
              description: La parte ya vencida.
        purchases:
          type: object
          description: |
            Facturas y notas de débito recibidas emitidas en el mes, más las
            liquidaciones de compra autorizadas.
          required: [total]
          properties:
            total:
              type: number
        payable:
          type: object
          description: Lo que hoy se debe a proveedores por documentos recibidos, sin importar el mes.
          required: [total, count]
          properties:
            total:
              type: number
            count:
              type: integer
              description: Documentos con saldo pendiente.
    SalesSummaryReport:
      type: object
      required: [from, to, store_id, current, previous, change, series, series_granularity, top_products, top_customers, sales_by_store]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        store_id:
          type: [string, "null"]
          format: uuid
          description: El establecimiento filtrado, o `null` para todos.
        current:
          $ref: "#/components/schemas/SalesSummaryTotals"
        previous:
          description: El período anterior de igual duración (o el mes, semana o año calendario anterior).
          $ref: "#/components/schemas/SalesSummaryTotals"
        change:
          type: object
          required: [subtotal_pct]
          properties:
            subtotal_pct:
              type: [number, "null"]
              description: Variación porcentual de las ventas netas frente al período anterior. `null` si el anterior no tuvo ventas.
        series:
          type: array
          description: Ventas netas por día o por mes, con ceros donde no hubo ventas. Termina hoy si el rango sigue en curso.
          items:
            type: object
            required: [date, subtotal]
            properties:
              date:
                type: string
                format: date
                description: El día, o el primer día del mes.
              subtotal:
                type: number
        series_granularity:
          type: string
          enum: [day, month]
        top_products:
          type: array
          description: Los 5 productos más vendidos por subtotal.
          items:
            type: object
            required: [id, name, quantity, unit, revenue]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              quantity:
                type: number
              unit:
                type: string
                description: La unidad para mostrar junto a la cantidad ("unidades", "kg"…).
              revenue:
                type: number
                description: Subtotal vendido, sin impuestos.
        top_customers:
          type: array
          description: Los 5 clientes con más ventas.
          items:
            type: object
            required: [id, name, count, revenue]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              count:
                type: integer
              revenue:
                type: number
                description: Ventas netas.
        sales_by_store:
          type: array
          description: Ventas por establecimiento, de mayor a menor.
          items:
            type: object
            required: [id, code, name, count, revenue]
            properties:
              id:
                type: string
                format: uuid
              code:
                type: string
              name:
                type: [string, "null"]
              count:
                type: integer
              revenue:
                type: number
                description: Ventas netas.
    SalesSummaryTotals:
      type: object
      required: [subtotal, iva, total, count, average_ticket]
      properties:
        subtotal:
          type: number
          description: Ventas netas, sin impuestos.
        iva:
          type: number
        total:
          type: number
          description: Total facturado, con impuestos.
        count:
          type: integer
        average_ticket:
          type: number
          description: Ventas netas promedio por factura.
    IvaReport:
      type: object
      required: [period, period_type, ventas, compras, retenciones, summary]
      properties:
        period:
          type: string
          description: El mes (`AAAA-MM`) o el semestre (`AAAA-S1`, `AAAA-S2`) del reporte.
          example: "2026-S2"
        period_type:
          type: string
          enum: [mensual, semestral]
        ventas:
          type: object
          required: [facturas, notas_credito, notas_debito]
          properties:
            facturas:
              type: array
              items:
                $ref: "#/components/schemas/IvaReportRow"
            notas_credito:
              type: array
              items:
                $ref: "#/components/schemas/IvaReportRow"
            notas_debito:
              type: array
              items:
                $ref: "#/components/schemas/IvaReportRow"
        compras:
          type: object
          required: [facturas, liquidaciones, notas_credito, notas_debito, documents_without_lines]
          properties:
            facturas:
              type: array
              items:
                $ref: "#/components/schemas/IvaReportRow"
            liquidaciones:
              type: array
              items:
                $ref: "#/components/schemas/IvaReportRow"
            notas_credito:
              type: array
              items:
                $ref: "#/components/schemas/IvaReportRow"
            notas_debito:
              type: array
              items:
                $ref: "#/components/schemas/IvaReportRow"
            documents_without_lines:
              type: object
              description: |
                Comprobantes recibidos cuyo detalle aún no está guardado, y que
                por eso quedan fuera de las filas. Es lo que le falta al reporte.
              required: [count, total_without_taxes, total_iva]
              properties:
                count:
                  type: integer
                total_without_taxes:
                  type: number
                total_iva:
                  type: number
        retenciones:
          type: object
          required: [recibidas, emitidas]
          properties:
            recibidas:
              type: array
              description: Retenciones que te hicieron tus clientes.
              items:
                $ref: "#/components/schemas/IvaReportRetentionRow"
            emitidas:
              type: array
              description: Retenciones que hiciste a tus proveedores.
              items:
                $ref: "#/components/schemas/IvaReportRetentionRow"
        summary:
          type: object
          required:
            - iva_ventas_facturas
            - iva_ventas_notas_credito
            - iva_ventas_notas_debito
            - iva_ventas
            - iva_compras
            - saldo_iva
            - iva_retenido_por_clientes
            - iva_retenido_a_proveedores
            - credito_tributario
            - total_a_pagar
            - position
          properties:
            iva_ventas_facturas:
              type: number
            iva_ventas_notas_credito:
              type: number
            iva_ventas_notas_debito:
              type: number
            iva_ventas:
              type: number
              description: IVA cobrado, neto de notas de crédito.
            iva_compras:
              type: number
              description: IVA pagado, neto de notas de crédito.
            saldo_iva:
              type: number
              description: IVA cobrado menos IVA pagado.
            iva_retenido_por_clientes:
              type: number
            iva_retenido_a_proveedores:
              type: number
            credito_tributario:
              type: number
            total_a_pagar:
              type: number
              description: IVA por pagar más lo retenido a proveedores.
            position:
              type: string
              enum: [por_pagar, credito_tributario, equilibrado]
              description: El signo de `saldo_iva`.
    IvaReportRow:
      type: object
      description: Un tipo de IVA en una sección del reporte.
      required: [impuesto, subtotal_sin_impuestos, descuento_adicional, base_imponible, notas_credito, valor_neto, total_impuesto]
      properties:
        impuesto:
          type: string
          example: IVA 15%
        subtotal_sin_impuestos:
          type: number
        descuento_adicional:
          type: number
        base_imponible:
          type: number
        notas_credito:
          type: number
        valor_neto:
          type: number
        total_impuesto:
          type: number
    IvaReportRetentionRow:
      type: object
      required: [tax_code, impuesto, codigo, base_imponible, valor_retenido]
      properties:
        tax_code:
          type: string
          description: Código del impuesto retenido (1 Renta, 2 IVA, 6 ISD).
        impuesto:
          type: string
          example: IVA 30%
        codigo:
          type: string
          description: Código de retención del SRI.
        base_imponible:
          type: number
        valor_retenido:
          type: number
    Certificate:
      type: object
      required: [id, name, active, expires_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Nombre generado del certificado (incluye el RUC y la fecha de vencimiento).
        active:
          type: boolean
          description: Si es el certificado activo de la cuenta (solo uno lo está a la vez).
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Fecha de vencimiento del certificado.
    CertificateEnvelope:
      type: object
      required: [certificate]
      properties:
        certificate:
          $ref: "#/components/schemas/Certificate"
    CertificateCreateRequest:
      type: object
      required: [certificate]
      properties:
        certificate:
          type: object
          required: [p12_file, p12_password]
          properties:
            p12_file:
              type: string
              format: byte
              description: Archivo .p12 (PKCS#12) codificado en base64.
            p12_password:
              type: string
              description: Contraseña del certificado .p12.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Mensaje de error descriptivo, en español.
    AccountCreateRequest:
      type: object
      required: [account]
      properties:
        account:
          type: object
          required: [ruc, email, phone, plan]
          description: |
            Solo necesitas el RUC, los datos de contacto y el plan. El perfil del
            negocio (razón social, dirección, régimen, obligaciones tributarias) y
            los establecimientos activos se obtienen automáticamente del SRI y no
            se pueden sobrescribir.
          properties:
            ruc:
              type: string
              description: RUC ecuatoriano de 13 dígitos. Debe ser único y existir en el SRI.
            email:
              type: string
              format: email
            phone:
              type: string
            plan:
              type: string
              enum: [basico, profesional, empresarial]
            production_mode:
              type: boolean
              description: Ambiente del SRI. Si se omite, la cuenta se crea en el ambiente de pruebas (`false`).
    AccountUpdateRequest:
      type: object
      required: [account]
      properties:
        account:
          type: object
          description: |
            Envía solo los campos que quieras cambiar. El campo `plan` se ignora
            al editar tu propia cuenta y solo se aplica al editar una cuenta que
            administras.
          properties:
            razon_social:
              type: string
              description: Razón social (nombre legal registrado del negocio).
            nombre_comercial:
              type: string
              description: Nombre comercial del negocio.
            dir_matriz:
              type: string
              description: Dirección de la matriz (establecimiento principal).
            email:
              type: string
              format: email
            phone:
              type: string
            billing_email:
              type: string
              format: email
            plan:
              type: string
              enum: [basico, profesional, empresarial]
            regimen:
              type: string
              enum: [general, negocio_popular, rimpe]
            obligado_contabilidad:
              type: boolean
            agente_retencion:
              type: boolean
            contribuyente_especial:
              type: boolean
            exportador:
              type: boolean
            sector_turistico:
              type: boolean
            production_mode:
              type: boolean
    Pagination:
      type: object
      required: [page, total_pages, total_count]
      properties:
        page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: [integer, "null"]
          description: "`null` en las listas que no cuentan, como las facturas con `creditable`."
    InvoiceSummary:
      type: object
      required: [id, status, sequential, emission_date, total]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, pending, authorized, rejected, cancelled]
        sequential:
          type: string
          description: Secuencial completo (establecimiento-punto-secuencial).
        emission_date:
          type: string
          format: date
        contact_name:
          type: [string, "null"]
          description: Razón social del cliente.
        total:
          type: number
          description: Total de la factura, con impuestos.
    TaxTotal:
      type: object
      required: [code, label, rate, base, iva]
      properties:
        code:
          type: string
          description: Código de porcentaje de IVA del SRI.
        label:
          type: string
          description: Como lo nombra el RIDE, p. ej. "IVA 15%" o "no objeto de IVA".
        rate:
          type: number
        base:
          type: number
          description: Subtotal gravado con este tipo de IVA.
        iva:
          type: number
    DocumentDetail:
      type: object
      required: [id, product_id, product_variant_id, code, description, quantity, unit_price, discount, subtotal, tax_percentage_code, tax_rate, tax_value, ice_rate, total]
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: [string, "null"]
          format: uuid
        product_variant_id:
          type: [string, "null"]
          format: uuid
          description: Variante facturada. Para editar el documento, reenvíala como `product_variant_id`.
        code:
          type: [string, "null"]
        description:
          type: string
        quantity:
          type: number
        unit_price:
          type: number
        discount:
          type: number
        subtotal:
          type: number
        tax_percentage_code:
          type: string
          description: Código de porcentaje de IVA del SRI.
        tax_rate:
          type: number
          description: Porcentaje de IVA aplicado.
        tax_value:
          type: number
        ice_rate:
          type: [number, "null"]
          description: Porcentaje de ICE del ítem, o `null` si no grava ICE.
        total:
          type: number
    Invoice:
      type: object
      required: [id, status, sequential, emission_date, contact, emission_point, payment_method, payments, total_without_taxes, total_discount, taxes, total_ice, total, access_key, authorization_number, error_message, creditable_amount, credit_notes, debit_notes, guia_remisions, collectible, outstanding_amount, collections, public_url, pdf_url, created_at, items]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, pending, authorized, rejected, cancelled]
        sequential:
          type: string
        emission_date:
          type: string
          format: date
        contact:
          type: object
          properties:
            id:
              type: string
              format: uuid
            razon_social:
              type: [string, "null"]
            identificacion:
              type: [string, "null"]
        emission_point:
          $ref: "#/components/schemas/EmissionPointReference"
        payment_method:
          type: string
          description: Código SRI de la forma de pago principal (el primer pago de contado, o el primero si todo es a crédito).
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        total_without_taxes:
          type: number
        total_discount:
          type: number
        taxes:
          type: array
          description: Base e IVA por tipo de IVA, como los totaliza el RIDE.
          items:
            $ref: "#/components/schemas/TaxTotal"
        total_ice:
          type: number
        total:
          type: number
        access_key:
          type: [string, "null"]
          description: Clave de acceso de 49 dígitos (presente una vez enviada al SRI).
        authorization_number:
          type: [string, "null"]
        error_message:
          type: [string, "null"]
          description: Motivo del rechazo, cuando el estado es `rejected`.
        creditable_amount:
          type: number
          description: Lo que queda por acreditar con notas de crédito; las anuladas no cuentan.
        credit_notes:
          type: array
          description: Las notas de crédito que acreditan la factura.
          items:
            $ref: "#/components/schemas/CreditNoteSummary"
        debit_notes:
          type: array
          description: Las notas de débito que cargan a la factura.
          items:
            $ref: "#/components/schemas/DebitNoteSummary"
        guia_remisions:
          type: array
          description: Las guías de remisión que trasladan lo vendido en la factura.
          items:
            $ref: "#/components/schemas/GuiaRemisionSummary"
        collectible:
          type: boolean
          description: Autorizada, a crédito y con saldo pendiente; admite registrar cobros.
        outstanding_amount:
          type: number
          description: Lo que queda por cobrar de la parte a crédito. 0 en facturas de contado.
        collections:
          type: array
          description: Cobros registrados contra la parte a crédito, del más reciente al más antiguo.
          items:
            $ref: "#/components/schemas/Collection"
        public_url:
          type: [string, "null"]
          format: uri
          description: Página pública de la factura para compartir con el cliente. Solo cuando está autorizada.
        pdf_url:
          type: [string, "null"]
          format: uri
          description: El RIDE en PDF. Solo cuando está autorizada.
        created_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceItem"
    Payment:
      type: object
      required: [forma_pago, detail_code, amount, plazo, due_date, notes]
      properties:
        forma_pago:
          type: string
          description: Código SRI de forma de pago.
        detail_code:
          type: [string, "null"]
          description: Detalle interno de la forma de pago (marca de tarjeta, banco), p. ej. `visa_credito`.
        amount:
          type: number
        plazo:
          type: [integer, "null"]
          description: Días de crédito. Vacío si se pagó de contado.
        due_date:
          type: [string, "null"]
          format: date
          description: Fecha de vencimiento de un pago a crédito.
        notes:
          type: [string, "null"]
    PaymentRequest:
      type: object
      required: [forma_pago, amount]
      properties:
        forma_pago:
          type: string
          enum: ["01", "15", "16", "17", "18", "19", "20", "21"]
          description: Código SRI de forma de pago.
        detail_code:
          type: string
          enum: [amex, visa_credito, mastercard_credito, diners, discover, visa_debito, mastercard_debito, banco_pichincha, banco_guayaquil, produbanco, banco_pacifico, banco_bolivariano, banco_internacional, banco_austro, banco_solidario, banco_promerica, otra_institucion]
          description: |
            Detalle opcional de la forma de pago. Debe pertenecer a `forma_pago`:

            - `19` Tarjeta de crédito: `amex`, `visa_credito`, `mastercard_credito`, `diners`, `discover`
            - `16` Tarjeta de débito: `visa_debito`, `mastercard_debito`
            - `20` Otros con utilización del sistema financiero: `banco_pichincha`, `banco_guayaquil`, `produbanco`, `banco_pacifico`, `banco_bolivariano`, `banco_internacional`, `banco_austro`, `banco_solidario`, `banco_promerica`, `otra_institucion`
        amount:
          type: number
          description: Monto del pago. Los pagos deben sumar el total de la factura.
        plazo:
          type: integer
          description: Días de crédito. Omítelo para un pago de contado.
        notes:
          type: string
    InvoiceItem:
      allOf:
        - $ref: "#/components/schemas/DocumentDetail"
        - type: object
          required: [creditable_quantity]
          properties:
            creditable_quantity:
              type: number
              description: Cuánto de esta línea aún pueden devolver notas de crédito; las anuladas no cuentan.
    InvoiceEnvelope:
      type: object
      required: [invoice]
      properties:
        invoice:
          $ref: "#/components/schemas/Invoice"
    EmailDelivery:
      type: object
      description: El email del cliente al que se envía el documento.
      required: [email]
      properties:
        email:
          type: string
          format: email
    DocumentStatus:
      type: object
      description: Identificador y estado de un documento tras una acción de ciclo de vida (envío, anulación). Consulta el recurso completo con `GET`.
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, pending, authorized, rejected, cancelled]
    DocumentDetailRequest:
      type: object
      description: |
        Referencia un producto por `product_variant_id` (preferido) o por
        `product_id` (usa la variante por defecto del producto). Los impuestos
        se derivan del producto.
      properties:
        product_variant_id:
          type: string
          format: uuid
          description: ID de la variante del producto. Preferido.
        product_id:
          type: string
          format: uuid
          description: ID del producto. Atajo que resuelve a su variante por defecto.
        quantity:
          type: number
          description: Cantidad (por defecto 1).
        unit_price:
          type: number
          description: Precio unitario. Si se omite, usa el de la variante.
        discount:
          type: number
          description: Descuento (por defecto 0).
    InvoiceCreateRequest:
      type: object
      required: [invoice]
      properties:
        invoice:
          type: object
          required: [contact_id, emission_point_id, items, payments]
          properties:
            contact_id:
              type: string
              format: uuid
              description: Cliente de la factura.
            emission_point_id:
              type: string
              format: uuid
            payments:
              type: array
              minItems: 1
              description: Formas de pago de la factura, de contado o a crédito.
              items:
                $ref: "#/components/schemas/PaymentRequest"
            items:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/DocumentDetailRequest"
    InvoiceUpdateRequest:
      type: object
      required: [invoice]
      properties:
        invoice:
          type: object
          description: Envía solo los campos que quieras cambiar.
          properties:
            contact_id:
              type: string
              format: uuid
            payments:
              type: array
              minItems: 1
              description: Si se envía, reemplaza todos los pagos actuales.
              items:
                $ref: "#/components/schemas/PaymentRequest"
            items:
              type: array
              description: Si se envía, reemplaza todos los ítems actuales.
              items:
                $ref: "#/components/schemas/DocumentDetailRequest"
    CreditNoteSummary:
      type: object
      required: [id, status, sequential, emission_date, contact_name, invoice_id, invoice_sequential, total]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, pending, authorized, rejected, cancelled]
        sequential:
          type: string
          description: Número completo, p. ej. `001-001-000000021`.
        emission_date:
