  "/api/v1/accounts/{account_id}/invoices":
    parameters:
    - name: account_id
      in: path
      required: true
      description: Identificador de la cuenta. Usa el de tu propia cuenta o el de
        una cuenta que administras.
      schema:
        type: string
        format: uuid
    get:
      operationId: listInvoices
      summary: Listar facturas
      description: |
        Devuelve las facturas de la cuenta en el ambiente activo (pruebas o
        producción), de la más reciente a la más antigua, con paginación.
      tags:
      - Facturas
      parameters:
      - name: query
        in: query
        description: Buscar por número, clave de acceso o autorización, o por nombre
          o identificación del cliente.
        schema:
          type: string
      - name: status
        in: query
        description: Filtrar por estado.
        schema:
          type: string
          enum:
          - draft
          - pending
          - authorized
          - rejected
          - cancelled
      - name: creditable
        in: query
        description: Con `true`, solo las facturas autorizadas a las que aún les queda
          valor por acreditar con una nota de crédito. Sin conteo, `pagination.total_count`
          llega en `null` y `total_pages` dice solo si hay una página más.
        schema:
          type: boolean
      - name: contact_id
        in: query
        description: Filtrar por cliente.
        schema:
          type: string
          format: uuid
      - name: emission_date_from
        in: query
        description: Facturas emitidas desde esta fecha (YYYY-MM-DD).
        schema:
          type: string
          format: date
      - name: emission_date_to
        in: query
        description: Facturas emitidas hasta esta fecha (YYYY-MM-DD).
        schema:
          type: string
          format: date
      - name: page
        in: query
        description: Número de página (25 por página).
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Las facturas de la cuenta, paginadas.
          content:
            application/json:
              schema:
                type: object
                required:
                - invoices
                - pagination
                properties:
                  invoices:
                    type: array
                    items:
                      "$ref": "#/components/schemas/InvoiceSummary"
                  pagination:
                    "$ref": "#/components/schemas/Pagination"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
    post:
      operationId: createInvoice
      summary: Crear una factura
      description: |
        Crea una factura en borrador. Los impuestos de cada ítem se derivan
        automáticamente del producto referenciado; solo envías el producto, la
        cantidad y el descuento. Para enviarla al SRI, usa luego el endpoint de
        envío.
      tags:
      - Facturas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/InvoiceCreateRequest"
      responses:
        '201':
          description: La factura creada en borrador.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InvoiceEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
