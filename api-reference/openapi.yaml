            reason:
              type: string
              description: Motivo de la nota de crédito.
            invoice_emission_date:
              type: [string, "null"]
              format: date
            total_without_taxes:
              type: number
            total_discount:
              type: number
            taxes:
              type: array
              description: Base e IVA por tipo de IVA, como los totaliza el RIDE.
