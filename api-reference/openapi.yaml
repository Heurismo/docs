          type: string
          format: uuid
          description: Variante única de un producto sin variantes con nombre. Para facturarlo, envíala como `product_variant_id`.
        variants:
          type: array
          description: Variantes con nombre que se venden (activas). Vacío para un producto de un solo SKU. Para facturar una, envía su `id` como `product_variant_id`.
          items:
            type: object
            required: [id, code, name, price_before_tax]
            properties:
              id:
                type: string
                format: uuid
              code:
                type: string
              name:
                type: string
              price_before_tax:
                type: number
              stock_quantity:
                type: number
                description: Existencias de la variante, si controla stock.
