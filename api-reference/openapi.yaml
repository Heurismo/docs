  /api/v1/accounts/{account_id}/products:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta. Usa el de tu propia cuenta o el de una cuenta que administras.
        schema:
          type: string
          format: uuid
    get:
      operationId: listProducts
      summary: Listar productos
      description: Devuelve los productos y servicios de la cuenta, ordenados por nombre, con paginación.
      tags: [Productos]
      parameters:
        - name: query
          in: query
          description: Buscar por nombre, código, código secundario, descripción o GTIN.
          schema:
            type: string
        - name: product_type
          in: query
          description: Filtrar por tipo.
          schema:
            type: string
            enum: [bien, servicio]
        - name: ids[]
          in: query
          description: Solo estos productos, todos en una página. Sirve para refrescar los impuestos de las líneas de un borrador.
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: page
          in: query
          description: Número de página (25 por página).
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Los productos de la cuenta, paginados.
          content:
            application/json:
              schema:
                type: object
                required: [products, pagination]
                properties:
                  products:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProductSummary"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createProduct
      summary: Crear un producto
      description: |
        Crea un producto o servicio. Para controlar inventario, envía
        `track_stock: true` (se ignora en servicios) y, opcionalmente,
        `initial_stock` para registrar las existencias iniciales en el kardex.
      tags: [Productos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateRequest"
      responses:
        "201":
          description: El producto creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/accounts/{account_id}/products/{id}:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        description: Identificador del producto.
        schema:
          type: string
          format: uuid
    get:
      operationId: getProduct
      summary: Consultar un producto
      description: Incluye la configuración de impuestos, las variantes con nombre y el inventario.
      tags: [Productos]
      responses:
        "200":
          description: El producto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEnvelope"
