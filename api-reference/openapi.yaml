---
openapi: 3.1.0
info:
  title: Tellen API
  version: 1.0.0
  description: |
    API REST de Tellen para facturación electrónica en Ecuador.

    Autentícate con un token de API (`Authorization: Bearer tellen_tk_...`) que
    generas desde tu cuenta de Tellen. Todas las solicitudes actúan sobre una
    cuenta, indicada por su identificador en la ruta:
    `/api/v1/accounts/{account_id}/...`.

    Si intentas acceder a una cuenta que no administras, la API responde `404`.
servers:
- url: https://dashboard.tellen.app
  description: Producción
security:
- bearerAuth: []
tags:
- name: Cuentas
  description: Tu cuenta.
- name: Certificados
  description: Certificados de firma electrónica (.p12) usados para firmar documentos
    ante el SRI.
- name: Contactos
  description: Clientes y proveedores de la cuenta.
- name: Establecimientos
  description: Establecimientos (sucursales) de la cuenta.
- name: Puntos de emisión
  description: Puntos de emisión por establecimiento, desde donde se emiten los comprobantes.
- name: Productos
  description: |
    Catálogo de productos y servicios de la cuenta, con su configuración de
    impuestos y su stock.
- name: Facturas
  description: Facturas de venta (comprobante electrónico 01).
- name: Notas de crédito
  description: Notas de crédito (comprobante electrónico 04). Cada una acredita una
    factura autorizada.
- name: Notas de débito
  description: Notas de débito (comprobante electrónico 05). Cada una carga a una
    factura autorizada, p. ej. intereses por mora o gastos de cobranza.
- name: Liquidaciones de compra
  description: Liquidaciones de compra (comprobante electrónico 03). Lo que la cuenta
    compra a un proveedor que no puede emitir factura; al autorizarse, lo comprado
    entra al stock.
- name: Retenciones
  description: Comprobantes de retención (comprobante electrónico 07) que emites a
    un proveedor sobre su factura, nota de débito o tu liquidación de compra.
- name: Guías de remisión
  description: Guías de remisión (comprobante electrónico 06). Cada una acompaña el
    traslado de lo vendido en una factura autorizada.
- name: Transportistas
  description: Quién transporta la mercadería de una guía de remisión, con su placa
    por defecto.
paths:
  "/api/v1/me":
    get:
      operationId: getMe
      summary: Consultar tu usuario
      description: |
        Devuelve el usuario dueño del token: la persona que inició sesión o, con
        un token de API, el usuario de API de tu cuenta.
      tags:
      - Cuentas
      responses:
        '200':
          description: Tu usuario.
          content:
            application/json:
              schema:
                type: object
                required:
                - user
                properties:
                  user:
                    "$ref": "#/components/schemas/User"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/api/v1/accounts":
    get:
      operationId: listAccounts
      summary: Listar cuentas
      description: 'Devuelve las cuentas a las que puedes acceder con tu token.

        '
      tags:
      - Cuentas
      responses:
        '200':
          description: Las cuentas a las que puedes acceder.
          content:
            application/json:
              schema:
                type: object
                required:
                - accounts
                properties:
                  accounts:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Account"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
    post:
      operationId: createAccount
      summary: Crear una cuenta
      description: |
        Provisiona una nueva cuenta bajo tu gestión a partir de su RUC. El perfil
        del negocio y sus establecimientos activos se obtienen del SRI; tú solo
        envías el RUC, los datos de contacto y el plan. Disponible solo si tu
        cuenta está habilitada para administrar varias cuentas; de lo contrario la
        API responde `404`. Si el RUC no existe en el SRI la API responde `404`, y
        si ya está registrado en Tellen responde `409`.
      tags:
      - Cuentas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AccountCreateRequest"
      responses:
        '201':
          description: La cuenta creada.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          description: El RUC ya está registrado en Tellen.
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: string
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/accounts/{id}":
    parameters:
    - name: id
      in: path
      required: true
      description: Identificador de la cuenta. Usa el de tu propia cuenta o el de
        una cuenta que administras.
      schema:
        type: string
        format: uuid
    get:
      operationId: getAccount
      summary: Consultar una cuenta
      tags:
      - Cuentas
      responses:
        '200':
          description: La cuenta.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
    patch:
      operationId: updateAccount
      summary: Actualizar una cuenta
      description: |
        Modifica los datos de tu cuenta o de una cuenta que administras. Envía
        solo los campos que quieras cambiar.

        El plan de tu propia cuenta se gestiona desde tu suscripción, por lo que
        el campo `plan` se ignora al editar tu cuenta; solo se aplica al editar
        una cuenta que administras.
      tags:
      - Cuentas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AccountUpdateRequest"
      responses:
        '200':
          description: La cuenta actualizada.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/accounts/{account_id}/certificates":
    parameters:
    - name: account_id
      in: path
      required: true
      description: Identificador de la cuenta. Usa el de tu propia cuenta o el de
        una cuenta que administras.
      schema:
        type: string
        format: uuid
    get:
      operationId: listCertificates
      summary: Listar certificados
      description: Devuelve los certificados de firma de la cuenta, del más reciente
        al más antiguo.
      tags:
      - Certificados
      responses:
        '200':
          description: Los certificados de la cuenta.
          content:
            application/json:
              schema:
                type: object
                required:
                - certificates
                properties:
                  certificates:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Certificate"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
    post:
      operationId: createCertificate
      summary: Subir un certificado de firma
      description: |
        Sube un certificado de firma electrónica (.p12 / PKCS#12) para la cuenta.
        Envía el archivo codificado en base64 junto con su contraseña. Si la
        contraseña es correcta, el certificado queda como el certificado activo
        de la cuenta y se usa para firmar sus documentos electrónicos.
      tags:
      - Certificados
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CertificateCreateRequest"
      responses:
        '201':
          description: El certificado subido, ahora activo.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CertificateEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/accounts/{account_id}/certificates/{id}":
    parameters:
    - name: account_id
      in: path
      required: true
      description: Identificador de la cuenta. Usa el de tu propia cuenta o el de
        una cuenta que administras.
      schema:
        type: string
        format: uuid
    - name: id
      in: path
      required: true
      description: Identificador del certificado.
      schema:
        type: string
        format: uuid
    get:
      operationId: getCertificate
      summary: Consultar un certificado
      tags:
      - Certificados
      responses:
        '200':
          description: El certificado.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CertificateEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
    delete:
      operationId: deleteCertificate
      summary: Eliminar un certificado
      description: |
        Elimina un certificado de la cuenta. Si eliminas el certificado activo,
        la cuenta queda sin certificado de firma hasta que subas otro.
      tags:
      - Certificados
      responses:
        '204':
          description: El certificado fue eliminado.
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/api/v1/accounts/{account_id}/contacts":
    parameters:
    - name: account_id
      in: path
      required: true
      description: Identificador de la cuenta. Usa el de tu propia cuenta o el de
        una cuenta que administras.
      schema:
        type: string
        format: uuid
    get:
      operationId: listContacts
      summary: Listar contactos
      description: Devuelve los clientes y proveedores de la cuenta, ordenados por
        razón social, con paginación.
      tags:
      - Contactos
      parameters:
      - name: query
        in: query
        description: Buscar por razón social o identificación.
        schema:
          type: string
      - name: contact_type
        in: query
        description: Filtrar por tipo.
        schema:
          type: string
          enum:
          - cliente
          - proveedor
      - name: invoiceable
        in: query
        description: Con `true`, solo los contactos que pueden ir en un comprobante
          del SRI (excluye los que no tienen identificación).
        schema:
          type: boolean
      - name: page
        in: query
        description: Número de página (25 por página).
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Los contactos de la cuenta, paginados.
          content:
            application/json:
              schema:
                type: object
                required:
                - contacts
                - pagination
                properties:
                  contacts:
                    type: array
                    items:
                      "$ref": "#/components/schemas/ContactSummary"
                  pagination:
                    "$ref": "#/components/schemas/Pagination"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
    post:
      operationId: createContact
      summary: Crear un contacto
      tags:
      - Contactos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ContactCreateRequest"
      responses:
        '201':
          description: El contacto creado.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ContactEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/accounts/{account_id}/contacts/{id}":
    parameters:
    - name: account_id
      in: path
      required: true
      description: Identificador de la cuenta. Usa el de tu propia cuenta o el de
        una cuenta que administras.
      schema:
        type: string
        format: uuid
    - name: id
      in: path
      required: true
      description: Identificador del contacto.
      schema:
        type: string
        format: uuid
    get:
      operationId: getContact
      summary: Consultar un contacto
      tags:
      - Contactos
      responses:
        '200':
          description: El contacto.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ContactEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
    patch:
      operationId: updateContact
      summary: Actualizar un contacto
      description: Envía solo los campos que quieras cambiar.
      tags:
      - Contactos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ContactUpdateRequest"
      responses:
        '200':
          description: El contacto actualizado.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ContactEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
    delete:
      operationId: deleteContact
      summary: Eliminar un contacto
      description: Solo se pueden eliminar contactos sin documentos asociados.
      tags:
      - Contactos
      responses:
        '204':
          description: El contacto fue eliminado.
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/accounts/{account_id}/stores":
    parameters:
    - name: account_id
      in: path
      required: true
      description: Identificador de la cuenta. Usa el de tu propia cuenta o el de
        una cuenta que administras.
      schema:
        type: string
        format: uuid
    get:
      operationId: listStores
      summary: Listar establecimientos
      description: Devuelve los establecimientos de la cuenta, ordenados por código,
        con paginación.
      tags:
      - Establecimientos
      parameters:
      - name: page
        in: query
        description: Número de página (25 por página).
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Los establecimientos de la cuenta, paginados.
          content:
            application/json:
              schema:
                type: object
                required:
                - stores
                - pagination
                properties:
                  stores:
                    type: array
                    items:
                      "$ref": "#/components/schemas/StoreSummary"
                  pagination:
                    "$ref": "#/components/schemas/Pagination"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/api/v1/accounts/{account_id}/stores/{id}":
    parameters:
    - name: account_id
      in: path
      required: true
      description: Identificador de la cuenta.
      schema:
        type: string
        format: uuid
    - name: id
      in: path
      required: true
      description: Identificador del establecimiento.
      schema:
        type: string
        format: uuid
    get:
      operationId: getStore
      summary: Consultar un establecimiento
      description: Incluye los puntos de emisión del establecimiento.
      tags:
      - Establecimientos
      responses:
        '200':
          description: El establecimiento.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StoreEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/api/v1/accounts/{account_id}/emission_points":
    parameters:
    - name: account_id
      in: path
      required: true
      description: Identificador de la cuenta.
      schema:
        type: string
        format: uuid
    get:
      operationId: listEmissionPoints
      summary: Listar puntos de emisión
      description: Devuelve los puntos de emisión de la cuenta, ordenados por código,
        con paginación.
      tags:
      - Puntos de emisión
      parameters:
      - name: store_id
        in: query
        description: Filtrar por establecimiento.
        schema:
          type: string
          format: uuid
      - name: first_id
        in: query
        description: Pone este punto de emisión primero en la lista, para que siempre
          esté en la primera página.
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Número de página (25 por página).
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Los puntos de emisión de la cuenta, paginados.
          content:
            application/json:
              schema:
                type: object
                required:
                - emission_points
                - pagination
                properties:
                  emission_points:
                    type: array
                    items:
                      "$ref": "#/components/schemas/EmissionPointSummary"
                  pagination:
                    "$ref": "#/components/schemas/Pagination"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
    post:
      operationId: createEmissionPoint
      summary: Crear un punto de emisión
      tags:
      - Puntos de emisión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EmissionPointCreateRequest"
      responses:
        '201':
          description: El punto de emisión creado.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EmissionPointEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/accounts/{account_id}/emission_points/{id}":
    parameters:
    - name: account_id
      in: path
      required: true
      description: Identificador de la cuenta.
      schema:
        type: string
        format: uuid
    - name: id
      in: path
      required: true
      description: Identificador del punto de emisión.
      schema:
        type: string
        format: uuid
    get:
      operationId: getEmissionPoint
      summary: Consultar un punto de emisión
      tags:
      - Puntos de emisión
      responses:
        '200':
          description: El punto de emisión.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EmissionPointEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
    patch:
      operationId: updateEmissionPoint
      summary: Actualizar un punto de emisión
      description: Envía solo los campos que quieras cambiar.
      tags:
      - Puntos de emisión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EmissionPointUpdateRequest"
      responses:
        '200':
          description: El punto de emisión actualizado.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EmissionPointEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
    delete:
      operationId: deleteEmissionPoint
      summary: Eliminar un punto de emisión
      description: Solo se pueden eliminar puntos de emisión sin documentos asociados.
      tags:
      - Puntos de emisión
      responses:
        '204':
          description: El punto de emisión fue eliminado.
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/accounts/{account_id}/products":
    parameters:
    - name: account_id
      in: path
      required: true
      description: Identificador de la cuenta. Usa el de tu propia cuenta o el de
        una cuenta que administras.
      schema:
        type: string
        format: uuid
    get:
      operationId: listProducts
      summary: Listar productos
      description: Devuelve los productos y servicios de la cuenta, ordenados por
        nombre, con paginación.
      tags:
      - Productos
      parameters:
      - name: query
        in: query
        description: Buscar por nombre, código, código secundario, descripción o GTIN.
        schema:
          type: string
      - name: product_type
        in: query
        description: Filtrar por tipo.
        schema:
          type: string
          enum:
          - bien
          - servicio
      - name: ids[]
        in: query
        description: Solo estos productos, todos en una página. Sirve para refrescar
          los impuestos de las líneas de un borrador.
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: page
        in: query
        description: Número de página (25 por página).
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Los productos de la cuenta, paginados.
          content:
            application/json:
              schema:
                type: object
                required:
                - products
                - pagination
                properties:
                  products:
                    type: array
                    items:
                      "$ref": "#/components/schemas/ProductSummary"
                  pagination:
                    "$ref": "#/components/schemas/Pagination"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
    post:
      operationId: createProduct
      summary: Crear un producto
      description: |
        Crea un producto o servicio. Para controlar inventario, envía
        `track_stock: true` (se ignora en servicios) y, opcionalmente,
        `initial_stock` para fijar el stock inicial.
      tags:
      - Productos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProductCreateRequest"
      responses:
        '201':
          description: El producto creado.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProductEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/accounts/{account_id}/products/{id}":
    parameters:
