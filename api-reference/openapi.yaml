components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Token de API enviado como `Authorization: Bearer tellen_tk_...`. Genera
        tu token desde tu cuenta de Tellen. Tu cuenta debe tener el acceso a la
        API habilitado.
  schemas:
    User:
      type: object
      required:
      - id
      - email
      - name
      - image_url
      - provider
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type:
          - string
          - 'null'
          description: Nombre y apellido, o `null` si no los ha registrado.
        image_url:
          type:
          - string
          - 'null'
          format: uri
          description: Foto de perfil de Google o Apple, o `null` si no tiene.
        provider:
          type:
          - string
          - 'null'
          enum:
          - google_oauth2
          - apple
          -
          description: Con qué cuenta inicia sesión, o `null` si usa correo y contraseña.
    Account:
      type: object
      description: Forma resumida (para listados).
      required:
      - id
      - razon_social
      - nombre_comercial
      - ruc
      - plan
      properties:
        id:
          type: string
          format: uuid
        razon_social:
          type: string
          description: Razón social (nombre legal registrado del negocio).
        nombre_comercial:
          type: string
          description: Nombre comercial del negocio.
        ruc:
          type: string
          description: RUC ecuatoriano de 13 dígitos.
        plan:
          type: string
          enum:
          - basico
          - profesional
          - empresarial
        logo_url:
          type:
          - string
          - 'null'
          format: uri
          description: URL pública del logo de la cuenta, o `null` si no tiene.
    AccountCreateRequest:
      type: object
      required:
      - account
      properties:
        account:
          type: object
          required:
          - ruc
          - email
          - phone
          - plan
          description: |
            Solo necesitas el RUC, los datos de contacto y el plan. El perfil del
            negocio (razón social, dirección, régimen, obligaciones tributarias) y
            los establecimientos activos se obtienen automáticamente del SRI y no
            se pueden sobrescribir.
          properties:
            ruc:
              type: string
              description: RUC ecuatoriano de 13 dígitos. Debe ser único y existir
                en el SRI.
            email:
              type: string
              format: email
            phone:
              type: string
            plan:
              type: string
              enum:
              - basico
              - profesional
              - empresarial
            production_mode:
              type: boolean
              description: Ambiente del SRI. Si se omite, la cuenta se crea en el
                ambiente de pruebas (`false`).
    AccountEnvelope:
      type: object
      required:
      - account
      properties:
        account:
          "$ref": "#/components/schemas/AccountDetail"
    AccountUpdateRequest:
      type: object
      required:
      - account
      properties:
        account:
          type: object
          description: |
            Envía solo los campos que quieras cambiar. El campo `plan` se ignora
            al editar tu propia cuenta y solo se aplica al editar una cuenta que
            administras.
          properties:
            razon_social:
              type: string
              description: Razón social (nombre legal registrado del negocio).
            nombre_comercial:
              type: string
              description: Nombre comercial del negocio.
            dir_matriz:
              type: string
              description: Dirección de la matriz (establecimiento principal).
            email:
              type: string
              format: email
            phone:
              type: string
            billing_email:
              type: string
              format: email
            plan:
              type: string
              enum:
              - basico
              - profesional
              - empresarial
            regimen:
              type: string
              enum:
              - general
              - negocio_popular
              - rimpe
            obligado_contabilidad:
              type: boolean
            agente_retencion:
              type: boolean
            contribuyente_especial:
              type: boolean
            exportador:
              type: boolean
            sector_turistico:
              type: boolean
            production_mode:
              type: boolean
    Certificate:
      type: object
      required:
      - id
      - name
      - active
      - expires_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Nombre generado del certificado (incluye el RUC y la fecha
            de vencimiento).
        active:
          type: boolean
          description: Si es el certificado activo de la cuenta (solo uno lo está
            a la vez).
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Fecha de vencimiento del certificado.
    CertificateCreateRequest:
      type: object
      required:
      - certificate
      properties:
        certificate:
          type: object
          required:
          - p12_file
          - p12_password
          properties:
            p12_file:
              type: string
              format: byte
              description: Archivo .p12 (PKCS#12) codificado en base64.
            p12_password:
              type: string
              description: Contraseña del certificado .p12.
    CertificateEnvelope:
      type: object
      required:
      - certificate
      properties:
        certificate:
          "$ref": "#/components/schemas/Certificate"
    ContactSummary:
      type: object
      required:
      - id
      - razon_social
      - identificacion
      - tipo_identificacion
      - cliente
      - proveedor
      properties:
        id:
          type: string
          format: uuid
        razon_social:
          type: string
        identificacion:
          type:
          - string
          - 'null'
          description: RUC, cédula, pasaporte, etc. `null` cuando el tipo es `sin_identificacion`.
        tipo_identificacion:
          type: string
          enum:
          - cedula
          - ruc
          - pasaporte
          - identificacion_del_exterior
          - sin_identificacion
          description: "`sin_identificacion` es un contacto con solo nombre; no sirve
            para comprobantes del SRI."
        cliente:
          type: boolean
        proveedor:
          type: boolean
    Pagination:
      type: object
      required:
      - page
      - total_pages
      - total_count
      properties:
        page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type:
          - integer
          - 'null'
          description: "`null` en las listas que no cuentan, como las facturas con
            `creditable`."
    ContactCreateRequest:
      type: object
      required:
      - contact
      properties:
        contact:
          type: object
          required:
          - razon_social
          - tipo_identificacion
