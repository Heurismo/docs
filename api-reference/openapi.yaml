        y su XML. El envío ocurre en segundo plano.
      tags: [Facturas]
      responses:
        "202":
          description: El correo quedó en cola.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailDelivery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/accounts/{account_id}/credit_notes:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta. Usa el de tu propia cuenta o el de una cuenta que administras.
        schema:
          type: string
          format: uuid
    get:
      operationId: listCreditNotes
      summary: Listar notas de crédito
      description: |
        Devuelve las notas de crédito de la cuenta en el ambiente activo (pruebas o
        producción), de la más reciente a la más antigua, con paginación.
      tags: [Notas de crédito]
      parameters:
        - name: query
          in: query
          description: Buscar por número, clave de acceso, autorización o documento modificado, o por nombre o identificación del cliente.
          schema:
            type: string
        - name: status
          in: query
          description: Filtrar por estado.
          schema:
            type: string
            enum: [draft, pending, authorized, rejected, cancelled]
        - name: invoice_id
          in: query
          description: Filtrar por la factura que acreditan.
          schema:
            type: string
            format: uuid
        - name: contact_id
          in: query
          description: Filtrar por cliente.
          schema:
            type: string
            format: uuid
        - name: emission_date_from
          in: query
          description: Notas de crédito emitidas desde esta fecha (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: emission_date_to
          in: query
          description: Notas de crédito emitidas hasta esta fecha (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: page
          in: query
          description: Número de página (25 por página).
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Las notas de crédito de la cuenta, paginadas.
          content:
            application/json:
              schema:
                type: object
                required: [credit_notes, pagination]
                properties:
                  credit_notes:
                    type: array
                    items:
                      $ref: "#/components/schemas/CreditNoteSummary"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createCreditNote
      summary: Crear una nota de crédito
      description: |
        Crea una nota de crédito en borrador que acredita una factura autorizada.
        Envías la factura, el motivo y qué ítems de la factura se devuelven y
        cuántos; el precio y el descuento de cada ítem, el cliente y la
        referencia al documento modificado salen de la factura. No puede pasar
        de lo que queda por acreditar de la factura (`creditable_amount`), ni
        devolver más unidades de las facturadas. Para enviarla al SRI, usa luego
        el endpoint de envío.
      tags: [Notas de crédito]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditNoteCreateRequest"
      responses:
        "201":
          description: La nota de crédito creada en borrador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditNoteEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/accounts/{account_id}/credit_notes/{id}:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        description: Identificador de la nota de crédito.
        schema:
          type: string
          format: uuid
    get:
      operationId: getCreditNote
      summary: Consultar una nota de crédito
      description: Devuelve la nota de crédito con sus ítems, cliente y punto de emisión.
      tags: [Notas de crédito]
      responses:
        "200":
          description: La nota de crédito.
          content:
