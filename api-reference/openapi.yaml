          description: Envía solo los campos que quieras cambiar.
          properties:
            razon_social:
              type: string
            nombre_comercial:
              type: string
            tipo_identificacion:
              type: string
            identificacion:
              type: string
            cliente:
              type: boolean
            proveedor:
              type: boolean
            tipo_contribuyente:
              type: string
            email:
              type: string
              format: email
            phone:
              type: string
            mobile_phone:
              type: string
            address:
              type: string
            note:
              type: string
    StoreSummary:
      type: object
      required: [id, code, name, address]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Código de 3 dígitos del establecimiento.
        name:
          type: string
        address:
          type: string
    Store:
      allOf:
        - $ref: "#/components/schemas/StoreSummary"
        - type: object
          required: [emission_points]
          properties:
            phone:
              type: [string, "null"]
            email:
              type: [string, "null"]
            emission_points:
              type: array
              items:
                type: object
                required: [id, code]
                properties:
                  id:
                    type: string
                    format: uuid
                  code:
                    type: string
                  description:
                    type: [string, "null"]
    StoreEnvelope:
      type: object
      required: [store]
      properties:
        store:
          $ref: "#/components/schemas/Store"
    EmissionPointSummary:
      type: object
      required: [id, code, store_id, store_code]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Código de 3 dígitos del punto de emisión.
        description:
          type: [string, "null"]
        store_id:
          type: string
          format: uuid
        store_code:
          type: string
    EmissionPoint:
      allOf:
        - $ref: "#/components/schemas/EmissionPointSummary"
        - type: object
          properties:
            next_sequential_test:
              type: integer
              description: Siguiente secuencial a usar en el ambiente de pruebas.
            next_sequential_production:
              type: integer
              description: Siguiente secuencial a usar en producción.
            created_at:
              type: string
              format: date-time
    EmissionPointEnvelope:
      type: object
      required: [emission_point]
      properties:
        emission_point:
          $ref: "#/components/schemas/EmissionPoint"
    EmissionPointCreateRequest:
      type: object
      required: [emission_point]
      properties:
        emission_point:
          type: object
          required: [store_id, code]
          properties:
            store_id:
              type: string
              format: uuid
              description: Establecimiento al que pertenece.
            code:
              type: string
              description: Código de 3 dígitos, único por establecimiento.
            description:
              type: string
            next_sequential_test:
              type: integer
              description: Secuencial inicial en pruebas (por defecto 1).
            next_sequential_production:
              type: integer
              description: Secuencial inicial en producción (por defecto 1).
    EmissionPointUpdateRequest:
      type: object
      required: [emission_point]
      properties:
        emission_point:
          type: object
          description: Envía solo los campos que quieras cambiar.
          properties:
            store_id:
              type: string
              format: uuid
            code:
              type: string
            description:
              type: string
            next_sequential_test:
              type: integer
            next_sequential_production:
              type: integer
    ProductSummary:
      type: object
      required: [id, name, product_type, price_before_tax, iva, iva_rate, has_ice, ice_rate, track_stock, default_variant_id, variants]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: [string, "null"]
          description: Código interno, único por cuenta.
        product_type:
          type: string
          enum: [bien, servicio]
        price_before_tax:
          type: number
          description: Precio unitario sin impuestos.
        iva:
          type: string
          enum: ["0", "5", "8", "12", "15", no_objeto_iva, exento_iva]
        iva_rate:
          type: number
          description: Porcentaje de IVA aplicado.
        has_ice:
          type: boolean
          description: Si el producto grava ICE.
        ice_rate:
          type: [number, "null"]
          description: Porcentaje de ICE, o `null` si no aplica. Se calcula sobre el subtotal, y el IVA sobre el subtotal más el ICE.
        track_stock:
          type: boolean
          description: Si el producto controla inventario.
        default_variant_id:
          type: string
          format: uuid
          description: Variante única de un producto sin variantes con nombre. Para facturarlo, envíala como `product_variant_id`.
        variants:
          type: array
          description: Variantes con nombre que se venden (activas). Vacío para un producto de un solo SKU. Para facturar una, envía su `id` como `product_variant_id`.
          items:
            type: object
            required: [id, code, name, price_before_tax]
            properties:
              id:
                type: string
                format: uuid
              code:
                type: string
              name:
                type: string
              price_before_tax:
                type: number
              stock_quantity:
                type: number
                description: Existencias de la variante, si controla stock.
    Product:
      allOf:
        - $ref: "#/components/schemas/ProductSummary"
        - type: object
          properties:
            secondary_code:
              type: [string, "null"]
            gtin:
              type: [string, "null"]
            description:
              type: [string, "null"]
            unit_of_measurement:
              type: [string, "null"]
              enum: [unidad, litro, kilogramo, metro, metro_cuadrado, metro_cubico, caja, paquete, botella, lata, null]
            stock:
              type: [object, "null"]
              description: Inventario del producto, o `null` si no controla stock.
              required: [total]
              properties:
                total:
                  type: number
                  description: Existencias actuales sumadas sobre las variantes vendibles.
                status:
                  type: [string, "null"]
                  enum: [in_stock, low_stock, out_of_stock, "null"]
                  description: |
                    Estado consolidado de las variantes vendibles, o `null` si
                    ninguna reporta estado (p. ej. un producto que controla stock
                    pero sin variantes vendibles activas).
            created_at:
              type: string
              format: date-time
    ProductEnvelope:
      type: object
      required: [product]
      properties:
        product:
          $ref: "#/components/schemas/Product"
    ProductCreateRequest:
      type: object
      required: [product]
      properties:
        product:
          type: object
          required: [name, code, product_type, iva, price_before_tax]
          properties:
            name:
              type: string
            code:
              type: string
              description: Código interno, único por cuenta.
            secondary_code:
              type: string
            gtin:
              type: string
            product_type:
              type: string
              enum: [bien, servicio]
            description:
              type: string
            iva:
              type: string
              enum: ["0", "5", "8", "12", "15", no_objeto_iva, exento_iva]
            unit_of_measurement:
              type: string
              enum: [unidad, litro, kilogramo, metro, metro_cuadrado, metro_cubico, caja, paquete, botella, lata]
            price_before_tax:
              type: number
              description: Precio unitario sin impuestos.
            catalog_ice_tax_id:
              type: string
              format: uuid
              description: Impuesto ICE del catálogo, si aplica.
            track_stock:
              type: boolean
              description: Activa el control de inventario (ignorado en servicios).
            initial_stock:
              type: number
              description: Existencias iniciales, registradas en el kardex al crear.
            low_stock_threshold:
              type: number
              description: Umbral para marcar stock bajo.
    ProductUpdateRequest:
      type: object
      required: [product]
      properties:
        product:
          type: object
          description: Envía solo los campos que quieras cambiar. Las existencias no se editan aquí; se mueven a través del kardex.
          properties:
            name:
              type: string
            code:
              type: string
            secondary_code:
              type: string
            gtin:
              type: string
            product_type:
              type: string
              enum: [bien, servicio]
            description:
              type: string
            iva:
              type: string
              enum: ["0", "5", "8", "12", "15", no_objeto_iva, exento_iva]
            unit_of_measurement:
              type: string
              enum: [unidad, litro, kilogramo, metro, metro_cuadrado, metro_cubico, caja, paquete, botella, lata]
            price_before_tax:
              type: number
            catalog_ice_tax_id:
              type: string
              format: uuid
            track_stock:
              type: boolean
            low_stock_threshold:
              type: number
    OrderSummary:
      type: object
      required: [id, number, status, emission_date, contact_name, total, collected_amount, outstanding_amount]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: Número de la orden, p. ej. `ORD-000042`.
        status:
          type: string
          enum: [open, cancelled, emitted]
        emission_date:
          type: string
          format: date
        contact_name:
          type: string
          description: Razón social del cliente.
        total:
          type: number
          description: Total de la orden, con impuestos.
        collected_amount:
          type: number
          description: Suma de los abonos registrados.
        outstanding_amount:
          type: number
          description: Lo que falta abonar para cubrir el total.
    Order:
      allOf:
        - $ref: "#/components/schemas/OrderSummary"
        - type: object
          required: [contact, emission_point, notes, ready_to_emit, invoice_id, total_without_taxes, total_discount, taxes, total_ice, created_at, items, collections]
          properties:
            contact:
              type: object
              required: [id, razon_social, identificacion]
              properties:
                id:
                  type: string
                  format: uuid
                razon_social:
                  type: string
                identificacion:
                  type: string
            emission_point:
              description: Punto de emisión con el que se facturará; necesario para emitirlo.
              anyOf:
                - $ref: "#/components/schemas/EmissionPointReference"
                - type: "null"
            notes:
              type: [string, "null"]
            ready_to_emit:
              type: boolean
              description: "`true` si está abierto, tiene punto de emisión y los abonos cubren el total."
            invoice_id:
              type: [string, "null"]
              format: uuid
              description: La factura en que se emitió, si ya se emitió.
            total_without_taxes:
              type: number
            total_discount:
              type: number
            taxes:
              type: array
              description: Base e IVA por tipo de IVA, como los totaliza el RIDE.
              items:
                $ref: "#/components/schemas/TaxTotal"
            total_ice:
              type: number
            created_at:
              type: string
              format: date-time
            items:
              type: array
              items:
                $ref: "#/components/schemas/DocumentDetail"
            collections:
              type: array
              description: Abonos, del más reciente al más antiguo.
              items:
                $ref: "#/components/schemas/Collection"
    OrderEnvelope:
      type: object
      required: [order]
      properties:
        order:
          $ref: "#/components/schemas/Order"
    OrderCreateRequest:
      type: object
      required: [order]
      properties:
        order:
          type: object
          required: [contact_id, items]
          properties:
            contact_id:
              type: string
              format: uuid
              description: Cliente de la orden.
            emission_point_id:
              type: string
              format: uuid
              description: Punto de emisión con el que se facturará. Necesario para emitirlo.
            notes:
              type: string
            items:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/DocumentDetailRequest"
    OrderUpdateRequest:
      type: object
      required: [order]
      properties:
        order:
          type: object
          description: Envía solo los campos que quieras cambiar.
          properties:
            contact_id:
              type: string
              format: uuid
            emission_point_id:
              type: string
              format: uuid
            notes:
              type: string
            items:
              type: array
              description: Si se envía, reemplaza todos los ítems actuales.
              items:
                $ref: "#/components/schemas/DocumentDetailRequest"
    ReceivedDocumentSummary:
      type: object
      required: [id, type, number, emission_date, issuer_name, issuer_ruc, total, outstanding_amount]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [invoice, credit_note, debit_note, purchase_liquidation, retention]
        number:
          type: string
          description: Número del comprobante, p. ej. `001-001-000000123`.
        emission_date:
          type: [string, "null"]
          format: date
        issuer_name:
          type: string
          description: Razón social del proveedor.
        issuer_ruc:
          type: string
        total:
          type: number
        outstanding_amount:
          type: [number, "null"]
          description: Lo que aún se le debe al proveedor. `null` en lo que no se paga (notas de crédito, liquidaciones, retenciones).
    RetentionSummary:
      type: object
      required: [id, status, sequential, emission_date, contact_name, total_withheld]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, pending, authorized, rejected, cancelled]
        sequential:
          type: string
          description: Número completo, p. ej. `001-001-000000021`.
        emission_date:
          type: string
          format: date
        contact_name:
          type: [string, "null"]
          description: El proveedor (sujeto retenido).
        total_withheld:
          type: number
          description: Total retenido.
    RetentionContact:
      type: object
      required: [id, razon_social, identificacion]
      properties:
        id:
          type: string
          format: uuid
        razon_social:
          type: [string, "null"]
        identificacion:
          type: [string, "null"]
    RetentionItem:
      description: Una línea de retención, igual en las retenciones que emites y en las que recibes.
      type: object
      required: [id, retention_code_id, name, tax_code, tax_label, percentage_code, percentage, base, withheld_value, document_number]
      properties:
        id:
          type: string
          format: uuid
        retention_code_id:
          type: [string, "null"]
          format: uuid
          description: El código de retención del catálogo (`GET retention_codes`). `null` en las retenciones recibidas.
        name:
          type: [string, "null"]
          description: Nombre del código, p. ej. "Retención IVA 30%".
        tax_code:
          type: string
          description: Impuesto que se retiene. `1` renta, `2` IVA, `6` ISD.
        tax_label:
          type: string
          description: El impuesto como lo imprime el RIDE, p. ej. `RENTA`.
        percentage_code:
          type: string
          description: Código de retención del SRI, p. ej. `303`.
        percentage:
          type: number
        base:
          type: number
          description: Base imponible de la retención.
        withheld_value:
          type: number
          description: Valor retenido.
        document_number:
          type: [string, "null"]
          description: En una retención recibida, el comprobante sobre el que se retuvo, si lo indica.
    RetentionDocument:
      type: object
      required: [id, cod_doc_sustento, document_type, number, authorization_number, emission_date, cod_sustento, source_type, source_id, total_without_taxes, total, withholdings]
      properties:
        id:
          type: string
          format: uuid
        cod_doc_sustento:
          type: string
          description: Tipo de documento de sustento del SRI. `01` factura, `03` liquidación de compra, `05` nota de débito.
        document_type:
          type: [string, "null"]
          description: El tipo de documento, p. ej. "Factura".
        number:
          type: string
          description: Número del documento de sustento, p. ej. `001-001-000000123`.
        authorization_number:
          type: [string, "null"]
        emission_date:
          type: [string, "null"]
          format: date
        cod_sustento:
          type: string
          description: Código de sustento tributario del SRI (tabla 5), p. ej. `01` crédito tributario de IVA.
        source_type:
          description: De dónde sale. `null` si no lo encontramos.
          oneOf:
            - $ref: "#/components/schemas/RetentionSourceType"
            - type: "null"
        source_id:
          type: [string, "null"]
          format: uuid
          description: El comprobante recibido o la liquidación de compra de la que sale.
        total_without_taxes:
          type: number
        total:
          type: number
          description: Importe total del documento de sustento.
        withholdings:
          type: array
          items:
            $ref: "#/components/schemas/RetentionItem"
    Retention:
      allOf:
        - $ref: "#/components/schemas/RetentionSummary"
        - type: object
          required: [contact, emission_point, period_fiscal, access_key, authorization_number, error_message, public_url, pdf_url, created_at, documents]
          properties:
            contact:
              $ref: "#/components/schemas/RetentionContact"
            emission_point:
              $ref: "#/components/schemas/EmissionPointReference"
            period_fiscal:
              type: string
              description: Período fiscal, `MM/AAAA`.
            access_key:
              type: [string, "null"]
            authorization_number:
              type: [string, "null"]
            error_message:
              type: [string, "null"]
              description: Motivo del rechazo, cuando el estado es `rejected`.
            public_url:
              type: [string, "null"]
              format: uri
              description: Página pública para compartir con el proveedor. Solo cuando está autorizada.
            pdf_url:
              type: [string, "null"]
              format: uri
              description: El RIDE en PDF. Solo cuando está autorizada.
            created_at:
              type: string
              format: date-time
            documents:
              type: array
              description: Los documentos de sustento, cada uno con lo que retiene.
              items:
                $ref: "#/components/schemas/RetentionDocument"
    RetentionEnvelope:
      type: object
      required: [retention]
      properties:
        retention:
          $ref: "#/components/schemas/Retention"
    RetentionWriteRequest:
      type: object
      required: [retention]
      properties:
        retention:
          type: object
          properties:
            emission_point_id:
              type: string
              format: uuid
              description: Obligatorio al crear.
            period_fiscal:
              type: string
              description: Período fiscal, `MM/AAAA`. Por defecto, el mes de emisión.
            documents:
              type: array
              description: Los documentos de sustento, todos del mismo proveedor. Obligatorio al crear; al editar, reemplaza los actuales.
              items:
                type: object
                required: [source_type, source_id, items]
                properties:
                  source_type:
                    $ref: "#/components/schemas/RetentionSourceType"
                  source_id:
                    type: string
                    format: uuid
                    description: El comprobante recibido (con su XML) o la liquidación de compra autorizada.
                  cod_sustento:
                    type: string
                    description: Código de sustento tributario del SRI (tabla 5) válido para el tipo de documento. Por defecto `01`.
                  items:
                    type: array
                    minItems: 1
                    description: Un código de retención no se puede repetir en el mismo documento.
                    items:
                      type: object
                      required: [retention_code_id]
                      properties:
                        retention_code_id:
                          type: string
                          format: uuid
                        tax_base:
                          type: number
                          exclusiveMinimum: 0
                          description: Base de la retención. Por defecto, el IVA del documento para un código de IVA, y su subtotal para renta o ISD.
    RetentionSourceType:
      type: string
      enum: [received_document, purchase_liquidation]
      description: |
        De dónde sale un documento de sustento: `received_document`, una factura
        o nota de débito recibida; `purchase_liquidation`, una liquidación de
        compra autorizada de la cuenta.
    RetentionCode:
      type: object
      required: [id, name, tax_code, percentage_code, percentage]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tax_code:
          type: string
          description: Impuesto que retiene. `1` renta, `2` IVA, `6` ISD.
        percentage_code:
          type: string
          description: Código de retención del SRI, p. ej. `303`.
        percentage:
          type: number
    ReceivedDocument:
      description: El comprobante según su tipo. Todos comparten los datos del sobre (`ReceivedDocumentEnvelope`).
      oneOf:
        - $ref: "#/components/schemas/ReceivedLinesDocument"
        - $ref: "#/components/schemas/ReceivedRetention"
        - $ref: "#/components/schemas/ReceivedDebitNote"
      discriminator:
        propertyName: type
        mapping:
          invoice: "#/components/schemas/ReceivedLinesDocument"
          credit_note: "#/components/schemas/ReceivedLinesDocument"
          purchase_liquidation: "#/components/schemas/ReceivedLinesDocument"
          retention: "#/components/schemas/ReceivedRetention"
          debit_note: "#/components/schemas/ReceivedDebitNote"
    ReceivedDocumentEnvelope:
      allOf:
        - $ref: "#/components/schemas/ReceivedDocumentSummary"
        - type: object
          required: [access_key, authorization_number, authorization_date, contact_id, modified_document_number, xml_pending, suggested_paid_on, retainable, retentions, disbursements]
          properties:
            access_key:
              type: string
            authorization_number:
              type: [string, "null"]
            authorization_date:
              type: [string, "null"]
              format: date-time
            contact_id:
              type: [string, "null"]
              format: uuid
              description: El emisor como contacto, si ya existe.
            modified_document_number:
              type: [string, "null"]
              description: El comprobante que modifica una nota de crédito o de débito.
            xml_pending:
              type: boolean
              description: Aún no llega el XML autorizado; hasta entonces no hay detalle ni impuestos.
            suggested_paid_on:
              type: [string, "null"]
              format: date
              description: Fecha sugerida para un pago nuevo (la de autorización, si no es futura). `null` en lo que no se paga.
            retainable:
              type: boolean
              description: Se puede retener sobre él (`source_type` `received_document` al crear una retención), es decir, una factura o nota de débito con su XML.
            retentions:
              type: array
              description: Las retenciones que emitiste sobre este comprobante, en el ambiente activo.
              items:
                $ref: "#/components/schemas/RetentionSummary"
            disbursements:
              type: array
              description: Pagos hechos al proveedor, del más reciente al más antiguo.
              items:
                $ref: "#/components/schemas/Disbursement"
    ReceivedLinesDocument:
      description: Factura, nota de crédito o liquidación de compra recibida.
      allOf:
        - $ref: "#/components/schemas/ReceivedDocumentEnvelope"
        - type: object
          required: [type, total_without_taxes, taxes, total_ice, items]
          properties:
            type:
              type: string
              enum: [invoice, credit_note, purchase_liquidation]
            total_without_taxes:
              type: number
            taxes:
              type: array
              description: Base e IVA por tipo de IVA, como los totaliza el RIDE.
              items:
                $ref: "#/components/schemas/TaxTotal"
            total_ice:
              type: number
            items:
              type: array
              items:
                $ref: "#/components/schemas/DocumentDetail"
    ReceivedDebitNote:
      description: Nota de débito recibida. `modified_document_number` es el comprobante al que se refiere.
      allOf:
        - $ref: "#/components/schemas/ReceivedDocumentEnvelope"
        - type: object
          required: [type, total_without_taxes, taxes, total_ice, motives]
          properties:
            type:
              type: string
              enum: [debit_note]
            total_without_taxes:
              type: number
            taxes:
              type: array
              description: Base e IVA por tipo de IVA.
              items:
                $ref: "#/components/schemas/TaxTotal"
            total_ice:
              type: number
            motives:
              type: array
              items:
                $ref: "#/components/schemas/DebitNoteMotive"
    ReceivedRetention:
      description: Comprobante de retención recibido. El emisor es el cliente que nos retuvo; `total` es lo retenido.
      allOf:
        - $ref: "#/components/schemas/ReceivedDocumentEnvelope"
        - type: object
          required: [type, withholdings, documents]
          properties:
            type:
              type: string
              enum: [retention]
            withholdings:
              type: array
              description: Cada impuesto retenido.
              items:
                $ref: "#/components/schemas/RetentionItem"
            documents:
              type: array
              description: Los comprobantes sobre los que se retuvo.
              items:
                type: object
                required: [code, name, number, emission_date, invoice_id, withheld_value]
                properties:
                  code:
                    type: string
                    description: Código SRI del tipo de comprobante, p. ej. `01` factura.
                  name:
                    type: string
                    description: p. ej. "FACTURA".
                  number:
                    type: string
                  emission_date:
                    type: [string, "null"]
                    format: date
                  invoice_id:
                    type: [string, "null"]
                    format: uuid
                    description: Nuestra factura con ese número, si la emitimos en producción.
                  withheld_value:
                    type: number
                    description: Lo retenido sobre este comprobante.
    Disbursement:
      type: object
      required: [id, amount, paid_on, forma_pago, forma_pago_label, notes]
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: number
        paid_on:
          type: string
          format: date
        forma_pago:
          type: string
          description: Código SRI de forma de pago.
        forma_pago_label:
          type: string
          description: Nombre SRI de la forma de pago.
        notes:
          type: [string, "null"]
    Collection:
      type: object
      required: [id, amount, collected_on, forma_pago, forma_pago_label, notes]
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: number
        collected_on:
          type: string
          format: date
        forma_pago:
          type: string
          description: Código SRI de forma de pago.
        forma_pago_label:
          type: string
          description: Nombre SRI de la forma de pago.
        notes:
          type: [string, "null"]
    CollectionCreateRequest:
      type: object
      required: [collection]
      properties:
        collection:
          type: object
          required: [amount, forma_pago]
          properties:
            amount:
              type: number
              description: Monto; no puede superar el saldo pendiente.
            forma_pago:
              type: string
              description: "Código SRI de forma de pago: `01` sin sistema financiero (efectivo), `19` tarjeta de crédito, `20` otros con sistema financiero (p. ej. transferencia)"
            collected_on:
              type: string
              format: date
              description: Fecha del pago (por defecto hoy; no puede ser futura).
            notes:
              type: string
    DisbursementCreateRequest:
      type: object
      required: [disbursement]
      properties:
        disbursement:
          type: object
          required: [amount, forma_pago]
          properties:
            amount:
              type: number
              description: Monto del pago; no puede superar el saldo pendiente.
            forma_pago:
              type: string
              description: "Código SRI de forma de pago: `01` sin sistema financiero (efectivo), `19` tarjeta de crédito, `20` otros con sistema financiero (p. ej. transferencia)"
            paid_on:
              type: string
              format: date
              description: Fecha del pago (por defecto `suggested_paid_on` del comprobante; no puede ser futura).
            notes:
              type: string
    Receivables:
      type: object
      required: [total, current, overdue, count, contacts]
      properties:
        total:
          type: number
          description: Saldo pendiente de todas las facturas.
        current:
          type: number
          description: Por vencer.
        overdue:
          type: number
          description: Vencido.
        count:
          type: integer
          description: Facturas con saldo.
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/ReceivablesContact"
    ReceivablesContact:
      type: object
      required: [contact_id, name, total, overdue, invoices]
      properties:
        contact_id:
          type: string
          format: uuid
        name:
          type: [string, "null"]
          description: Razón social del cliente.
        total:
          type: number
        overdue:
          type: number
        invoices:
          type: array
          items:
            type: object
            required: [id, sequential, emission_date, due_date, days_overdue, outstanding_amount]
            properties:
              id:
                type: string
                format: uuid
              sequential:
                type: string
              emission_date:
                type: string
                format: date
              due_date:
                type: [string, "null"]
                format: date
              days_overdue:
                type: integer
                description: Días desde el vencimiento; 0 si aún no vence.
              outstanding_amount:
                type: number
    Payables:
      type: object
      required: [total, count, contacts]
      properties:
        total:
          type: number
          description: Saldo pendiente de todos los comprobantes.
        count:
          type: integer
          description: Comprobantes con saldo.
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/PayablesContact"
    PayablesContact:
      type: object
      required: [contact_id, name, ruc, total, documents]
      properties:
        contact_id:
          type: [string, "null"]
          format: uuid
          description: El proveedor como contacto, si ya existe.
        name:
          type: string
          description: Razón social del proveedor.
        ruc:
          type: string
        total:
          type: number
        documents:
          type: array
          description: Del más reciente al más antiguo.
          items:
            $ref: "#/components/schemas/ReceivedDocumentSummary"
  responses:
    Unauthorized:
      description: Falta el token, o es inválido o está inactivo. Verifica el encabezado `Authorization`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Tu cuenta no tiene el acceso a la API habilitado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    QuotesForbidden:
      description: Tu plan no incluye cotizaciones (disponibles desde Profesional), o tu rol no permite esta acción.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReceivedDocumentsForbidden:
      description: Tu rol no permite ver comprobantes recibidos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OrdersForbidden:
      description: Tu plan no incluye órdenes (disponibles desde Profesional), o tu rol no permite esta acción.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UsersForbidden:
      description: Tu rol no permite administrar usuarios.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReportsForbidden:
      description: Tu rol no permite ver reportes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: La cuenta no existe o no la administras.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Los datos enviados no son válidos.
      content:
        application/json:
          schema:
            type: object
            required: [errors]
            properties:
              errors:
                type: array
                items:
                  type: string
              field_errors:
                type: object
                description: |
                  Los mismos mensajes agrupados por atributo (`razon_social`,
                  `identificacion`…), para mostrarlos junto a cada campo. Solo
                  viene cuando el error es de validación de datos; los errores
                  que no son de un campo concreto llegan bajo `base`.
                additionalProperties:
                  type: array
                  items:
                    type: string
