openapi: 3.1.0
info:
  title: Tellen API
  version: "1.0.0"
  description: |
    API REST de Tellen para facturación electrónica en Ecuador.

    Autentícate con un token de API (`Authorization: Bearer tellen_tk_...`) que
    generas desde tu cuenta de Tellen. Todas las solicitudes actúan sobre una
    cuenta, indicada por su identificador en la ruta:
    `/api/v1/accounts/{account_id}/...`.

    Normalmente ese identificador es el de tu propia cuenta. Si administras
    varias cuentas, usa el identificador de cada una para operar sobre ella. Si
    intentas acceder a una cuenta que no administras, la API responde `404`.
servers:
  - url: https://dashboard.tellen.app
    description: Producción
security:
  - bearerAuth: []
tags:
  - name: Cuentas
    description: Tu cuenta y, si administras varias, las cuentas que gestionas.
  - name: Resumen
    description: Las cifras del mes de una cuenta, lo vendido y comprado y lo que se debe.
  - name: Certificados
    description: Certificados de firma electrónica (.p12) usados para firmar documentos ante el SRI.
  - name: Contactos
    description: Clientes y proveedores de la cuenta.
  - name: Establecimientos
    description: Establecimientos (sucursales) de la cuenta, sincronizados desde el SRI.
  - name: Puntos de emisión
    description: Puntos de emisión por establecimiento, desde donde se emiten los comprobantes.
  - name: Productos
    description: |
      Catálogo de productos y servicios de la cuenta, con su configuración de
      impuestos e inventario.

      **Variantes.** Cada producto tiene al menos una variante interna. Un
      producto de un solo SKU se representa de forma plana (su variante por
      defecto es un detalle de implementación y no aparece en la respuesta), por
      lo que `variants` llega vacío. El arreglo `variants` solo lista variantes
      **con nombre** (talla, color, etc.), cuando existen.

      **Inventario.** El stock vive en las variantes, no en el producto; el campo
      `stock` es un consolidado de solo lectura sobre las variantes vendibles.
      Es `null` cuando el producto no controla inventario (todos los servicios, y
      los bienes con el control desactivado), lo que permite distinguir "no
      controla stock" de "controla stock, con 0 existencias".

      **El stock no se edita directamente.** Las existencias se mueven a través
      del kardex (entradas y salidas registradas por documentos autorizados,
      compras o ajustes), nunca escribiendo `stock_quantity`. Al **crear** un
      producto puedes fijar las existencias iniciales con `initial_stock`, que se
      registra como una entrada en el kardex. En una **actualización**,
      `initial_stock` se ignora.
  - name: Facturas
    description: Facturas de venta (comprobante electrónico 01).
  - name: Notas de crédito
    description: Notas de crédito (comprobante electrónico 04). Cada una acredita una factura autorizada.
  - name: Notas de débito
    description: Notas de débito (comprobante electrónico 05). Cada una carga a una factura autorizada, p. ej. intereses por mora o gastos de cobranza.
  - name: Liquidaciones de compra
    description: Liquidaciones de compra (comprobante electrónico 03). Lo que la cuenta compra a un proveedor que no puede emitir factura; al autorizarse, lo comprado entra al stock.
  - name: Retenciones
    description: Comprobantes de retención (comprobante electrónico 07) que emites a un proveedor sobre su factura, nota de débito o tu liquidación de compra.
  - name: Guías de remisión
    description: Guías de remisión (comprobante electrónico 06). Cada una acompaña el traslado de lo vendido en una factura autorizada.
  - name: Transportistas
    description: Quién transporta la mercadería de una guía de remisión, con su placa por defecto.
  - name: Cotizaciones
    description: |
      Cotizaciones (proformas) para tus clientes. No son comprobantes del SRI;
      se convierten en factura cuando el cliente acepta. Disponibles desde el
      plan Profesional.
  - name: Órdenes
    description: |
      Órdenes de tus clientes: acumulan abonos y se emiten como
      factura cuando los abonos cubren el total. No son comprobantes del SRI.
      Disponibles desde el plan Profesional.
  - name: Comprobantes recibidos
    description: |
      Comprobantes que te emitieron tus proveedores, tal como llegan del SRI.
      Por ahora, los que tienen detalle de productos: facturas, notas de
      crédito y liquidaciones de compra. Siempre son de producción.
  - name: Usuarios
    description: |
      Las personas de la cuenta, sus roles y las invitaciones pendientes. Las
      mismas reglas que en la web: solo un propietario asigna el rol de
      propietario, la cuenta nunca se queda sin propietario y el plan limita
      cuántos usuarios puede tener. Requieren poder administrar usuarios
      (`permissions.manage_users`).
  - name: Reportes
    description: |
      Los reportes de la web, con las mismas cifras. Los comprobantes emitidos
      siguen el ambiente de la cuenta (pruebas o producción); los recibidos del
      SRI no tienen ambiente. Requieren poder ver reportes
      (`permissions.read_reports`).
paths:
  /api/v1/me:
    get:
      operationId: getMe
      summary: Consultar tu usuario
      description: |
        Devuelve el usuario dueño del token: la persona que inició sesión o, con
        un token de API, el usuario de API de tu cuenta.
      tags: [Cuentas]
      responses:
        "200":
          description: Tu usuario.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/accounts:
    get:
      operationId: listAccounts
      summary: Listar cuentas
      description: |
        Devuelve las cuentas a las que puedes acceder con tu token: tu propia
        cuenta y, si administras varias, todas las que gestionas.
      tags: [Cuentas]
      responses:
        "200":
          description: Las cuentas a las que puedes acceder.
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createAccount
      summary: Crear una cuenta
      description: |
        Provisiona una nueva cuenta bajo tu gestión a partir de su RUC. El perfil
        del negocio y sus establecimientos activos se obtienen del SRI; tú solo
        envías el RUC, los datos de contacto y el plan. Disponible solo si tu
        cuenta está habilitada para administrar varias cuentas; de lo contrario la
        API responde `404`. Si el RUC no existe en el SRI la API responde `404`, y
        si ya está registrado en Tellen responde `409`.
      tags: [Cuentas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreateRequest"
      responses:
        "201":
          description: La cuenta creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: El RUC ya está registrado en Tellen.
          content:
            application/json:
              schema:
                type: object
                required: [errors]
                properties:
                  errors:
                    type: array
                    items:
                      type: string
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/accounts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador de la cuenta. Usa el de tu propia cuenta o el de una cuenta que administras.
        schema:
          type: string
          format: uuid
    get:
      operationId: getAccount
      summary: Consultar una cuenta
      tags: [Cuentas]
      responses:
        "200":
          description: La cuenta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAccount
      summary: Actualizar una cuenta
      description: |
        Modifica los datos de tu cuenta o de una cuenta que administras. Envía
        solo los campos que quieras cambiar.

        El plan de tu propia cuenta se gestiona desde tu suscripción, por lo que
        el campo `plan` se ignora al editar tu cuenta; solo se aplica al editar
        una cuenta que administras.
      tags: [Cuentas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdateRequest"
      responses:
        "200":
          description: La cuenta actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/accounts/{account_id}/summary:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
    get:
      operationId: getAccountSummary
      summary: Consultar el resumen del mes
      description: |
        Lo vendido y comprado en el mes, y lo que hoy está por cobrar y por
        pagar. Son los mismos totales de los reportes de ventas, cuentas por
        cobrar y cuentas por pagar.

        Ventas, compras propias (liquidaciones) y por cobrar siguen el ambiente
        de la cuenta (pruebas o producción). Las compras recibidas del SRI no
        tienen ambiente. Requiere poder ver reportes (`permissions.read_reports`).
      tags: [Resumen]
      parameters:
        - name: month
          in: query
          required: false
          description: Mes a resumir, como `AAAA-MM`. Por defecto, el mes en curso.
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
            example: "2026-10"
      responses:
        "200":
          description: El resumen del mes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSummaryEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReportsForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/accounts/{account_id}/certificates:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta. Usa el de tu propia cuenta o el de una cuenta que administras.
        schema:
          type: string
          format: uuid
    get:
      operationId: listCertificates
      summary: Listar certificados
      description: Devuelve los certificados de firma de la cuenta, del más reciente al más antiguo.
      tags: [Certificados]
      responses:
        "200":
          description: Los certificados de la cuenta.
          content:
            application/json:
              schema:
                type: object
                required: [certificates]
                properties:
                  certificates:
                    type: array
                    items:
                      $ref: "#/components/schemas/Certificate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createCertificate
      summary: Subir un certificado de firma
      description: |
        Sube un certificado de firma electrónica (.p12 / PKCS#12) para la cuenta.
        Envía el archivo codificado en base64 junto con su contraseña. Si la
        contraseña es correcta, el certificado queda como el certificado activo
        de la cuenta y se usa para firmar sus documentos electrónicos.
      tags: [Certificados]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateCreateRequest"
      responses:
        "201":
          description: El certificado subido, ahora activo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/accounts/{account_id}/certificates/{id}:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta. Usa el de tu propia cuenta o el de una cuenta que administras.
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        description: Identificador del certificado.
        schema:
          type: string
          format: uuid
    get:
      operationId: getCertificate
      summary: Consultar un certificado
      tags: [Certificados]
      responses:
        "200":
          description: El certificado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCertificate
      summary: Eliminar un certificado
      description: |
        Elimina un certificado de la cuenta. Si eliminas el certificado activo,
        la cuenta queda sin certificado de firma hasta que subas otro.
      tags: [Certificados]
      responses:
        "204":
          description: El certificado fue eliminado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/accounts/{account_id}/contacts:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta. Usa el de tu propia cuenta o el de una cuenta que administras.
        schema:
          type: string
          format: uuid
    get:
      operationId: listContacts
      summary: Listar contactos
      description: Devuelve los clientes y proveedores de la cuenta, ordenados por razón social, con paginación.
      tags: [Contactos]
      parameters:
        - name: query
          in: query
          description: Buscar por razón social o identificación.
          schema:
            type: string
        - name: contact_type
          in: query
          description: Filtrar por tipo.
          schema:
            type: string
            enum: [cliente, proveedor]
        - name: page
          in: query
          description: Número de página (25 por página).
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Los contactos de la cuenta, paginados.
          content:
            application/json:
              schema:
                type: object
                required: [contacts, pagination]
                properties:
                  contacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContactSummary"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createContact
      summary: Crear un contacto
      tags: [Contactos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactCreateRequest"
      responses:
        "201":
          description: El contacto creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/accounts/{account_id}/contacts/sri_lookup:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta. Usa el de tu propia cuenta o el de una cuenta que administras.
        schema:
          type: string
          format: uuid
    get:
      operationId: lookupContactInSri
      summary: Buscar un contacto en el SRI
      description: |
        Consulta el catastro público del SRI por RUC o cédula para prellenar un
        contacto nuevo. No guarda nada: el contacto se crea con `POST contacts`.

        Un RUC trae razón social, nombre comercial, dirección, tipo de contribuyente
        y si es contribuyente especial. Una cédula trae solo el nombre de la persona y, si
        tiene RUC, la dirección de ese RUC. La dirección llega
        solo hasta la parroquia (provincia, cantón, parroquia), sin la calle.

        Antes de consultar al SRI, la API valida el número y revisa la cuenta: el
        RUC de la propia cuenta responde `422`, y un contacto ya registrado con esa
        identificación responde `409` con ese contacto.
      tags: [Contactos]
      parameters:
        - name: identificacion
          in: query
          required: true
          description: Cédula (10 dígitos) o RUC (13 dígitos).
          schema:
            type: string
        - name: except
          in: query
          description: Identificador de un contacto que no cuenta como ya registrado; úsalo al editar ese contacto.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Los datos del SRI para el contacto.
          content:
            application/json:
              schema:
                type: object
                required: [contact, warning]
                properties:
                  contact:
                    type: object
                    description: Solo los campos que el SRI respondió.
                    required: [tipo_identificacion, identificacion, razon_social, tipo_contribuyente]
                    properties:
                      tipo_identificacion:
                        type: string
                        enum: [cedula, ruc]
                      identificacion:
                        type: string
                      razon_social:
                        type: string
                      nombre_comercial:
                        type: string
                      address:
                        type: string
                        description: Provincia, cantón y parroquia, separados por comas.
                      tipo_contribuyente:
                        type: string
                        enum: [persona_natural, persona_juridica]
                      contribuyente_special:
                        type: boolean
                        description: Solo para RUC.
                  warning:
                    type: [string, "null"]
                    description: Aviso cuando el RUC no está activo en el SRI, por ejemplo "Este RUC está suspendido en el SRI.".
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: La cuenta no existe, o el SRI no tiene registrada esa identificación.
          content:
            application/json:
              schema:
                type: object
                required: [errors]
                properties:
                  errors:
                    type: array
                    items:
                      type: string
        "409":
          description: Ya hay un contacto con esa identificación en la cuenta.
          content:
            application/json:
              schema:
                type: object
                required: [errors, contact]
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                  contact:
                    $ref: "#/components/schemas/ContactSummary"
        "422":
          description: El número no es una cédula ni un RUC válido, o es el RUC de la propia cuenta.
          content:
            application/json:
              schema:
                type: object
                required: [errors]
                properties:
                  errors:
                    type: array
                    items:
                      type: string
        "502":
          description: El SRI no respondió.
          content:
            application/json:
              schema:
                type: object
                required: [errors]
                properties:
                  errors:
                    type: array
                    items:
                      type: string
  /api/v1/accounts/{account_id}/contacts/{id}:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta. Usa el de tu propia cuenta o el de una cuenta que administras.
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        description: Identificador del contacto.
        schema:
          type: string
          format: uuid
    get:
      operationId: getContact
      summary: Consultar un contacto
      tags: [Contactos]
      responses:
        "200":
          description: El contacto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateContact
      summary: Actualizar un contacto
      description: Envía solo los campos que quieras cambiar.
      tags: [Contactos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdateRequest"
      responses:
        "200":
          description: El contacto actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteContact
      summary: Eliminar un contacto
      description: Solo se pueden eliminar contactos sin documentos asociados.
      tags: [Contactos]
      responses:
        "204":
          description: El contacto fue eliminado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/accounts/{account_id}/stores:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta. Usa el de tu propia cuenta o el de una cuenta que administras.
        schema:
          type: string
          format: uuid
    get:
      operationId: listStores
      summary: Listar establecimientos
      description: Devuelve los establecimientos de la cuenta, ordenados por código, con paginación.
      tags: [Establecimientos]
      parameters:
        - name: page
          in: query
          description: Número de página (25 por página).
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Los establecimientos de la cuenta, paginados.
          content:
            application/json:
              schema:
                type: object
                required: [stores, pagination]
                properties:
                  stores:
                    type: array
                    items:
                      $ref: "#/components/schemas/StoreSummary"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/accounts/{account_id}/stores/sync:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Identificador de la cuenta.
        schema:
          type: string
          format: uuid
    post:
      operationId: syncStores
      summary: Sincronizar establecimientos desde el SRI
      description: |
        Consulta los establecimientos de la cuenta en el SRI y crea uno por cada
        establecimiento activo (`ABIERTO`) que aún no exista. Es idempotente: los
        establecimientos ya registrados se omiten, así que puedes ejecutarlo las
        veces que quieras.
      tags: [Establecimientos]
      responses:
        "200":
          description: Resumen de la sincronización.
          content:
            application/json:
              schema:
                type: object
                required: [created, skipped_inactive, errors]
                properties:
                  created:
                    type: integer
