        format: uuid
    - name: id
      in: path
      required: true
      description: Identificador del producto.
      schema:
        type: string
        format: uuid
    get:
      operationId: getProduct
      summary: Consultar un producto
      description: Incluye la configuración de impuestos, las variantes con nombre
        y el inventario.
      tags:
      - Productos
      responses:
        '200':
          description: El producto.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProductEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
    patch:
      operationId: updateProduct
      summary: Actualizar un producto
      description: |
        Envía solo los campos que quieras cambiar. El stock no se edita aquí:
        `stock_quantity` no es modificable e `initial_stock` se ignora.
      tags:
      - Productos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProductUpdateRequest"
      responses:
        '200':
          description: El producto actualizado.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProductEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
    delete:
      operationId: deleteProduct
      summary: Eliminar un producto
      description: Solo se pueden eliminar productos sin documentos asociados.
      tags:
      - Productos
      responses:
        '204':
          description: El producto fue eliminado.
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/accounts/{account_id}/products/{product_id}/images":
    parameters:
    - name: account_id
      in: path
      required: true
      description: Identificador de la cuenta.
      schema:
        type: string
        format: uuid
    - name: product_id
      in: path
      required: true
      description: Identificador del producto.
      schema:
        type: string
        format: uuid
    post:
      operationId: createProductImage
      summary: Subir una foto
      description: |
        Agrega una foto al final de la galería del producto, o de una de sus
        variantes con `variant_id`. La primera foto es la portada que muestran
        los documentos y el catálogo. Hasta 8 fotos por galería.
      tags:
      - Productos
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: La foto (JPEG, PNG o WebP, hasta 3 MB).
                variant_id:
                  type: string
                  format: uuid
                  description: Variante con nombre a la que pertenece la foto. Sin
                    ella, la foto es del producto.
      responses:
        '201':
          description: El producto con la foto agregada.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProductEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
