  "/api/v1/accounts/{account_id}/guia_remisions":
    parameters:
    - name: account_id
      in: path
      required: true
      description: Identificador de la cuenta.
      schema:
        type: string
        format: uuid
    get:
      operationId: listGuiaRemisions
      summary: Listar guías de remisión
      description: |
        Devuelve las guías de remisión de la cuenta en el ambiente activo (pruebas
        o producción), de la más reciente a la más antigua, con paginación.
      tags:
      - Guías de remisión
      parameters:
      - name: query
        in: query
        description: Buscar por número, clave de acceso, autorización, documento de
          sustento o placa, o por nombre o identificación del destinatario.
        schema:
          type: string
      - name: status
        in: query
        description: Filtrar por estado.
        schema:
          type: string
          enum:
          - draft
          - pending
          - authorized
          - rejected
          - cancelled
      - name: invoice_id
        in: query
        description: Filtrar por la factura que sustentan.
        schema:
          type: string
          format: uuid
      - name: emission_date_from
        in: query
        description: Guías emitidas desde esta fecha (YYYY-MM-DD).
        schema:
          type: string
          format: date
      - name: emission_date_to
        in: query
        description: Guías emitidas hasta esta fecha (YYYY-MM-DD).
        schema:
          type: string
          format: date
      - name: page
        in: query
        description: Número de página (25 por página).
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Las guías de remisión de la cuenta, paginadas.
          content:
            application/json:
              schema:
                type: object
                required:
                - guia_remisions
                - pagination
                properties:
                  guia_remisions:
                    type: array
                    items:
                      "$ref": "#/components/schemas/GuiaRemisionSummary"
                  pagination:
                    "$ref": "#/components/schemas/Pagination"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
    post:
      operationId: createGuiaRemision
      summary: Crear una guía de remisión
      description: |
        Crea una guía de remisión en borrador para trasladar lo vendido en una
        factura autorizada. Solo la factura es obligatoria: el destinatario, los
        productos y el documento sustento salen de ella, y lo demás, si no lo
        envías, toma valores por defecto: la dirección del establecimiento como
        partida, la del cliente como destino, hoy como inicio y fin del
        transporte, motivo `venta`, y el transportista y la placa de la última
        guía de la cuenta. Para enviarla al SRI, usa luego el endpoint de envío.
      tags:
      - Guías de remisión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GuiaRemisionCreateRequest"
      responses:
        '201':
          description: La guía de remisión creada en borrador.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GuiaRemisionEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
