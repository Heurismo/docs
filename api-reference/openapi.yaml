            emission_point_id:
              type: string
              format: uuid
              description: Por defecto, el punto de emisión de la factura.
            items:
              type: array
              minItems: 1
              description: Ítems de la factura que se devuelven; el precio y el descuento salen de la factura.
              items:
                $ref: "#/components/schemas/DocumentDetailRequest"
    CreditNoteUpdateRequest:
      type: object
      required: [credit_note]
      properties:
        credit_note:
          type: object
          description: Envía solo los campos que quieras cambiar.
          properties:
            reason:
              type: string
            emission_point_id:
              type: string
              format: uuid
            items:
              type: array
              description: Si se envía, reemplaza todos los ítems actuales.
              items:
                $ref: "#/components/schemas/DocumentDetailRequest"
    DebitNoteSummary:
      type: object
      required: [id, status, sequential, emission_date, contact_name, invoice_id, invoice_sequential, total]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, pending, authorized, rejected, cancelled]
        sequential:
