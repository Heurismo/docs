            type:
            - string
            - 'null'
            description: Motivo del rechazo, cuando el estado es `rejected`.
          public_url:
            type:
            - string
            - 'null'
            format: uri
            description: Página pública para compartir con el proveedor. Solo cuando
              está autorizada.
          pdf_url:
            type:
            - string
            - 'null'
            format: uri
            description: El RIDE en PDF. Solo cuando está autorizada.
          created_at:
            type: string
            format: date-time
          items:
            type: array
            items:
              "$ref": "#/components/schemas/DocumentDetail"
    RetentionSourceType:
      type: string
      enum:
      - received_document
      - purchase_liquidation
      description: |
        De dónde sale un documento de sustento: `received_document`, una factura
        o nota de débito recibida; `purchase_liquidation`, una liquidación de
        compra autorizada de la cuenta.
    Retention:
      allOf:
      - "$ref": "#/components/schemas/RetentionSummary"
      - type: object
        required:
        - contact
        - emission_point
        - period_fiscal
        - access_key
        - authorization_number
        - error_message
        - public_url
        - pdf_url
        - created_at
        - documents
        properties:
          contact:
            "$ref": "#/components/schemas/RetentionContact"
          emission_point:
            "$ref": "#/components/schemas/EmissionPointReference"
          period_fiscal:
            type: string
            description: Período fiscal, `MM/AAAA`.
          access_key:
            type:
            - string
            - 'null'
          authorization_number:
            type:
            - string
            - 'null'
          error_message:
            type:
            - string
            - 'null'
            description: Motivo del rechazo, cuando el estado es `rejected`.
          public_url:
            type:
            - string
            - 'null'
            format: uri
            description: Página pública para compartir con el proveedor. Solo cuando
              está autorizada.
          pdf_url:
            type:
            - string
            - 'null'
            format: uri
            description: El RIDE en PDF. Solo cuando está autorizada.
          created_at:
            type: string
            format: date-time
          documents:
            type: array
            description: Los documentos de sustento, cada uno con lo que retiene.
            items:
              "$ref": "#/components/schemas/RetentionDocument"
    GuiaRemision:
      allOf:
      - "$ref": "#/components/schemas/GuiaRemisionSummary"
      - type: object
        required:
        - contact
        - emission_point
        - transportista
        - invoice_emission_date
        - motivo_traslado
        - fecha_fin_transporte
        - dir_partida
        - dir_destinatario
        - access_key
        - authorization_number
        - error_message
        - created_at
        - items
        properties:
          contact:
            type: object
            required:
            - id
            - razon_social
            - identificacion
            properties:
              id:
                type: string
                format: uuid
              razon_social:
                type:
                - string
                - 'null'
              identificacion:
                type:
                - string
                - 'null'
          emission_point:
            "$ref": "#/components/schemas/EmissionPointReference"
          transportista:
            "$ref": "#/components/schemas/Transportista"
          invoice_emission_date:
            type: string
            format: date
          motivo_traslado:
            type: string
            enum:
            - venta
            - compra
            - transformacion
            - consignacion
            - almacenamiento
            - exportacion
            - importacion
            - traslado_propio
          fecha_fin_transporte:
            type: string
            format: date
          dir_partida:
            type: string
          dir_destinatario:
            type: string
          access_key:
            type:
            - string
            - 'null'
          authorization_number:
            type:
            - string
            - 'null'
          error_message:
            type:
            - string
            - 'null'
            description: Motivo del rechazo, cuando el estado es `rejected`.
          created_at:
            type: string
            format: date-time
          items:
            type: array
            description: Los productos de la factura que se trasladan.
            items:
              "$ref": "#/components/schemas/GuiaRemisionItem"
    ProductImage:
      type: object
      required:
      - id
      - url
      - position
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        position:
          type: integer
          description: Orden en la galería; la de menor posición es la portada.
    EmissionPointReference:
      type: object
      description: El punto de emisión de un documento, con los códigos del SRI y
        los nombres para mostrar.
      required:
      - id
      - code
      - description
      - store_code
      - store_name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Código del punto de emisión, p. ej. `001`.
        description:
          type:
          - string
          - 'null'
          description: Nombre del punto de emisión, p. ej. "Caja 1".
        store_code:
          type:
          - string
          - 'null'
          description: Código del establecimiento, p. ej. `002`.
        store_name:
          type:
          - string
          - 'null'
          description: Nombre del establecimiento.
    Payment:
      type: object
      required:
      - forma_pago
      - detail_code
      - amount
      - plazo
      - due_date
      - notes
      properties:
        forma_pago:
          type: string
          description: Código SRI de forma de pago.
        detail_code:
          type:
          - string
          - 'null'
          description: Detalle interno de la forma de pago (marca de tarjeta, banco),
            p. ej. `visa_credito`.
        amount:
          type: number
        plazo:
          type:
          - integer
          - 'null'
          description: Días de crédito. Vacío si se pagó de contado.
        due_date:
          type:
          - string
          - 'null'
          format: date
          description: Fecha de vencimiento de un pago a crédito.
        notes:
          type:
          - string
          - 'null'
    TaxTotal:
      type: object
      required:
      - code
      - label
      - rate
      - base
      - iva
      properties:
        code:
          type: string
          description: Código de porcentaje de IVA del SRI.
        label:
          type: string
          description: Como lo nombra el RIDE, p. ej. "IVA 15%" o "no objeto de IVA".
        rate:
          type: number
        base:
          type: number
          description: Subtotal gravado con este tipo de IVA.
        iva:
          type: number
    InvoiceItem:
      allOf:
      - "$ref": "#/components/schemas/DocumentDetail"
      - type: object
        required:
        - creditable_quantity
        properties:
          creditable_quantity:
            type: number
            description: Cuánto de esta línea aún pueden devolver notas de crédito;
              las anuladas no cuentan.
    DocumentDetail:
      type: object
      required:
      - id
      - product_id
      - product_variant_id
      - code
      - description
      - quantity
      - unit_price
      - discount
      - subtotal
      - tax_percentage_code
      - tax_rate
      - tax_value
      - ice_rate
      - total
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type:
          - string
          - 'null'
          format: uuid
        product_variant_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Variante facturada. Para editar el documento, reenvíala como
            `product_variant_id`.
        code:
          type:
          - string
          - 'null'
        description:
          type: string
        quantity:
          type: number
        unit_price:
          type: number
        discount:
          type: number
        subtotal:
          type: number
        tax_percentage_code:
          type: string
          description: Código de porcentaje de IVA del SRI.
        tax_rate:
          type: number
          description: Porcentaje de IVA aplicado.
        tax_value:
          type: number
        ice_rate:
          type:
          - number
          - 'null'
          description: Porcentaje de ICE del ítem, o `null` si no grava ICE.
        total:
          type: number
    DebitNoteMotive:
      type: object
      required:
      - id
      - reason
      - value
      properties:
        id:
          type: string
          format: uuid
        reason:
          type: string
          description: Razón del cargo, p. ej. "Intereses por mora".
        value:
          type: number
          description: Valor sin IVA.
    RetentionContact:
      type: object
      required:
      - id
      - razon_social
      - identificacion
      properties:
        id:
          type: string
          format: uuid
        razon_social:
          type:
          - string
          - 'null'
        identificacion:
          type:
          - string
          - 'null'
    RetentionDocument:
      type: object
      required:
      - id
      - cod_doc_sustento
      - document_type
      - number
      - authorization_number
      - emission_date
      - cod_sustento
      - source_type
      - source_id
      - total_without_taxes
      - total
      - withholdings
      properties:
        id:
          type: string
          format: uuid
        cod_doc_sustento:
          type: string
          description: Tipo de documento de sustento del SRI. `01` factura, `03` liquidación
            de compra, `05` nota de débito.
        document_type:
          type:
          - string
          - 'null'
          description: El tipo de documento, p. ej. "Factura".
        number:
          type: string
          description: Número del documento de sustento, p. ej. `001-001-000000123`.
        authorization_number:
          type:
          - string
          - 'null'
        emission_date:
          type:
          - string
          - 'null'
          format: date
        cod_sustento:
          type: string
          description: Código de sustento tributario del SRI (tabla 5), p. ej. `01`
            crédito tributario de IVA.
        source_type:
          description: De dónde sale. `null` si no lo encontramos.
          oneOf:
          - "$ref": "#/components/schemas/RetentionSourceType"
          - type: 'null'
        source_id:
          type:
          - string
          - 'null'
          format: uuid
          description: El comprobante recibido o la liquidación de compra de la que
            sale.
        total_without_taxes:
          type: number
        total:
          type: number
          description: Importe total del documento de sustento.
        withholdings:
          type: array
          items:
            "$ref": "#/components/schemas/RetentionItem"
    GuiaRemisionItem:
      type: object
      required:
      - id
      - product_id
      - product_variant_id
      - code
      - description
      - quantity
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type:
          - string
          - 'null'
          format: uuid
        product_variant_id:
          type:
          - string
          - 'null'
          format: uuid
        code:
          type:
          - string
          - 'null'
        description:
          type: string
        quantity:
          type: number
    RetentionItem:
      description: Una línea de retención, igual en las retenciones que emites y en
        las que recibes.
      type: object
      required:
      - id
      - retention_code_id
      - name
      - tax_code
      - tax_label
      - percentage_code
      - percentage
      - base
      - withheld_value
      - document_number
      properties:
        id:
          type: string
          format: uuid
        retention_code_id:
          type:
          - string
          - 'null'
          format: uuid
          description: El código de retención del catálogo (`GET retention_codes`).
            `null` en las retenciones recibidas.
        name:
          type:
          - string
          - 'null'
          description: Nombre del código, p. ej. "Retención IVA 30%".
        tax_code:
          type: string
          description: Impuesto que se retiene. `1` renta, `2` IVA, `6` ISD.
        tax_label:
          type: string
          description: El impuesto como lo imprime el RIDE, p. ej. `RENTA`.
        percentage_code:
          type: string
          description: Código de retención del SRI, p. ej. `303`.
        percentage:
          type: number
        base:
          type: number
          description: Base imponible de la retención.
        withheld_value:
          type: number
          description: Valor retenido.
        document_number:
          type:
          - string
          - 'null'
          description: En una retención recibida, el comprobante sobre el que se retuvo,
            si lo indica.
  responses:
    Unauthorized:
      description: Falta el token, o es inválido o está inactivo. Verifica el encabezado
        `Authorization`.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Forbidden:
      description: Tu cuenta no tiene el acceso a la API habilitado.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    NotFound:
      description: La cuenta no existe o no la administras.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    ValidationError:
      description: Los datos enviados no son válidos.
      content:
        application/json:
          schema:
            type: object
            required:
            - errors
            properties:
              errors:
                type: array
                items:
                  type: string
              field_errors:
                type: object
                description: |
                  Los mismos mensajes agrupados por atributo (`razon_social`,
                  `identificacion`…), para mostrarlos junto a cada campo. Solo
                  viene cuando el error es de validación de datos; los errores
                  que no son de un campo concreto llegan bajo `base`.
                additionalProperties:
                  type: array
                  items:
                    type: string
