            pdf_url:
              type: [string, "null"]
              format: uri
              description: El RIDE en PDF. Solo cuando está autorizada.
            created_at:
              type: string
              format: date-time
            items:
              type: array
              items:
                $ref: "#/components/schemas/DocumentDetail"
    CreditNoteEnvelope:
      type: object
      required: [credit_note]
