      in: path
      required: true
      description: Identificador de la cuenta.
      schema:
        type: string
        format: uuid
    - name: id
      in: path
      required: true
      description: Identificador de la retención.
      schema:
        type: string
        format: uuid
    get:
      operationId: getRetention
      summary: Consultar una retención
      description: Devuelve la retención con su proveedor, punto de emisión y lo que
        retiene en cada documento de sustento.
      tags:
      - Retenciones
      responses:
        '200':
          description: La retención.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RetentionEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
    patch:
      operationId: updateRetention
      summary: Editar una retención
      description: |
        Edita una retención en borrador o rechazada. Puedes cambiar el punto de
        emisión y el período fiscal; si envías `documents`, reemplaza todos los
        documentos de sustento y sus códigos.
      tags:
      - Retenciones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RetentionWriteRequest"
