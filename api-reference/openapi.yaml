    parameters:
    - name: account_id
      in: path
      required: true
      description: Identificador de la cuenta.
      schema:
        type: string
        format: uuid
    - name: id
      in: path
      required: true
      description: Identificador de la factura.
      schema:
        type: string
        format: uuid
    post:
      operationId: voidInvoice
      summary: Anular una factura
      description: |
        Anula una factura autorizada. Solo es posible hasta el día 7 del mes
        siguiente a la emisión. Recuerda anular también el comprobante en el SRI.
      tags:
      - Facturas
      responses:
        '200':
          description: La factura anulada (`cancelled`).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DocumentStatus"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
