          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RetentionEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
    delete:
      operationId: deleteRetention
      summary: Eliminar una retención
      description: Elimina una retención en borrador. Las retenciones ya enviadas
        al SRI no se pueden eliminar.
      tags:
      - Retenciones
      responses:
        '204':
          description: La retención fue eliminada.
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/accounts/{account_id}/retentions/{id}/submit":
    parameters:
